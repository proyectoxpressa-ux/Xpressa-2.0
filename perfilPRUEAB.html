<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Cuenta - Xpressa+</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Nunito:wght@700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Nunito', sans-serif; -webkit-tap-highlight-color: transparent;}
        body { background-color: #F4F9FF; color: #1E293B; display: flex; flex-direction: column; min-height: 100vh; padding-bottom: 120px; }

        .header-top {
            display: flex; justify-content: center; align-items: center; padding: 1.5rem;
            background-color: #3B82F6; color: white; border-bottom-left-radius: 30px; border-bottom-right-radius: 30px;
            box-shadow: 0 10px 25px rgba(59, 130, 246, 0.2);
        }
        .header-title { font-family: 'Fredoka', sans-serif; font-size: 1.8rem; }

        main { padding: 30px 20px; max-width: 500px; margin: 0 auto; width: 100%; display: flex; flex-direction: column; gap: 20px;}

        .menu-card {
            background-color: #FFFFFF; padding: 25px; border-radius: 30px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.05); width: 100%; display: flex;
            align-items: center; justify-content: space-between; text-decoration: none;
            border: 4px solid #E2E8F0; transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .menu-card:hover { transform: scale(1.02); border-color: #3B82F6; }
        
        .menu-left { display: flex; align-items: center; gap: 20px; }
        .menu-icon-box {
            width: 65px; height: 65px; border-radius: 20px; background-color: #EFF6FF;
            display: flex; align-items: center; justify-content: center; font-size: 35px;
        }
        .menu-text { display: flex; flex-direction: column; gap: 2px;}
        .menu-title { font-family: 'Fredoka', sans-serif; font-size: 1.4rem; color: #1E293B; }
        .menu-subtitle { font-size: 1rem; font-weight: 800; color: #94A3B8; }
        .menu-arrow { font-size: 2rem; color: #CBD5E1; font-weight: 800; }

        .bottom-nav {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            width: 90%; max-width: 400px; background-color: #ffffff; display: flex; justify-content: space-around;
            padding: 15px 10px; border-radius: 40px; box-shadow: 0 15px 35px rgba(0,0,0,0.15); border: 3px solid #E2E8F0; z-index:10;
        }
        .nav-item { display: flex; flex-direction: column; align-items: center; gap:5px; text-decoration: none; color: #94A3B8; font-weight: 800; font-size: 0.9rem;}
        .nav-icon { font-size: 1.8rem; transition: transform 0.3s; }
        .nav-item.active { color: #3B82F6; }
        .nav-item.active .nav-icon { transform: scale(1.3) translateY(-5px); }
    </style>
</head>
<body>
    <header class="header-top"><div class="header-title">Mi Mochila 🎒</div></header>
    <main>
        <a href="editarperfil.html" class="menu-card">
            <div class="menu-left">
                <div class="menu-icon-box">✏️</div>
                <div class="menu-text">
                    <span class="menu-title">Mis Datos</span>
                    <span class="menu-subtitle">Cambia tu nombre o foto</span>
                </div>
            </div>
            <span class="menu-arrow">›</span>
        </a>
        <a href="elegirletraoficial.html" class="menu-card">
            <div class="menu-left">
                <div class="menu-icon-box">🔤</div>
                <div class="menu-text">
                    <span class="menu-title">Mis Letras</span>
                    <span class="menu-subtitle">Elige nuevos sonidos</span>
                </div>
            </div>
            <span class="menu-arrow">›</span>
        </a>
    </main>

    <nav class="bottom-nav">
        <a href="home.html" class="nav-item"><span class="nav-icon">🏠</span>Inicio</a>
        <a href="juegos.html" class="nav-item"><span class="nav-icon">🎮</span>Juegos</a>
        <a href="perfil.html" class="nav-item active"><span class="nav-icon">⚙️</span>Perfil</a>
    </nav>
</body>
</html>
