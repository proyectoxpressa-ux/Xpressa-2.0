<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lobby del Semáforo</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Nunito', sans-serif; }
        
        body {
            background-color: #F0F8FF;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px 15px;
            min-height: 100vh;
        }

        .top-bar {
            width : 100%;
            max-width: 600px;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            margin-bottom: 15px;
        }

        .btn-volver {
            text-decoration: none;
            color: #4A90E2;
            font-weight: 800;
            font-size: 18px; 
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #FFFFFF;
            padding: 8px 20px;
            border-radius: 20px;
            box-shadow: 0 2px 8px rgba(75, 145, 225, 0.1);
        }

        .contenedor-lobby {
            background: white;
            padding: 30px 35px;
            border-radius: 25px;
            box-shadow: 0 8px 25px rgba(74, 144, 226, 0.15);
            max-width: 600px;
            width: 100%;
            text-align: center;
        }

        .titulo-lobby {
            font-family: 'Fredoka', sans-serif;
            color: #4A90E2;
            font-size: 34px;
            margin-bottom: 8px;
        }

        .subtitulo {
            color: #64748B;
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 25px;
        }

        .grilla-sonidos {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 25px;
        }

        .btn-sonido {
            background-color: #F1F5F9;
            border: 3px solid #CBD5E1;
            border-radius: 18px;
            padding: 18px;
            font-size: 22px;
            font-weight: 800;
            color: #334155;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-sonido.seleccionado {
            background-color: #E0F2FE;
            border-color: #38BDF8;
            color: #0284C7;
            transform: scale(1.03);
            box-shadow: 0 4px 12px rgba(56, 189, 248, 0.2);
        }

        .btn-jugar {
            width: 100%;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 20px;
            padding: 20px;
            font-size: 26px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 6px 0 #388E3C;
            transition: all 0.1s;
        }

        .btn-jugar:active {
            transform: translateY(6px);
            box-shadow: none;
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <a href="juegos.html" class="btn-volver">← Volver</a>
    </div>

    <div class="contenedor-lobby">
        <h1 class="titulo-lobby">🚦 ¡El Semáforo! 🃏</h1>
        <p class="subtitulo">¿Qué sonido practicamos hoy?</p>

        <div class="grilla-sonidos">
            <button class="btn-sonido" onclick="seleccionarSonido('R', this)">R-RR 🐶</button>
            <button class="btn-sonido" onclick="seleccionarSonido('C', this)">C 🐌</button>
            <button class="btn-sonido" onclick="seleccionarSonido('PL', this)">PL 🪶</button>
            <button class="btn-sonido" onclick="seleccionarSonido('TR', this)">TR 🚂</button>
            <button class="btn-sonido" onclick="seleccionarSonido('DR', this)">DR 🐲</button>
            <button class="btn-sonido" onclick="seleccionarSonido('PR', this)">PR 🤴🏻</button>
        </div>

        <button class="btn-jugar" onclick="irAlJuego()">¡A JUGAR! 🚀</button>
    </div>

    <script>
        let sonidoElegido = "";

        function seleccionarSonido(sonido, elemento) {
            sonidoElegido = sonido;
            document.querySelectorAll('.btn-sonido').forEach(btn => btn.classList.remove('seleccionado'));
            elemento.classList.add('seleccionado');
        }

        function irAlJuego() {
            if (sonidoElegido === "") {
                alert("¡Falta elegir el sonido!");
                return;
            }

            localStorage.setItem("sonidoSemaforo", sonidoElegido);

            const rutasArchivos = {
                'R': 'semaforo-R-RR.html',
                'TR': 'semaforo-TR.html',
                'PR': 'semaforo-PR.html',
                'DR': 'semaforo-DR.html',
                'PL': 'semaforo-PL.html',
                'C': 'semaforo-C.html'
            };

            window.location.href = rutasArchivos[sonidoElegido];
        }
    </script>
</body>
</html>
