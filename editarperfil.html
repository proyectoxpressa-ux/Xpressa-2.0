<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xpressa+ | Mi Perfil</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
    
    <style>
        * { 
            margin: 0; 
            padding: 0; 
            /* box-sizing hace que los bordes y el relleno no agranden las cajas de más, evitando que el diseño se rompa */
            box-sizing: border-box; 
            font-family: 'Nunito', sans-serif; 
        }
        
        body {
            background-color: #F0F8FF;
            /* Usamos flexbox para centrar toda la tarjeta en la pantalla fácilmente */
            flex-direction: column;
            display: flex; 
            align-items: center;
            padding: 30px 15px 100px;
        }

        .top-bar {
            width : 100%;
            max-width: 480px; /* Maximo ancho para que no se deforme en ninguna pantalla */
            display: flex;
            align-items: center;
            justify-content: flex-start;
            margin-bottom: 10px;
        }

        .btn-volver {
            text-decoration: none; /*Elimina el subrayado*/
            color: #4A90E2; /* Color azul de la marca */
            font-weight: 800;
            font-size: 15px; 
            display: inline-flex; /* Para que el icono y el texto estén en línea */
            align-items: center;
            gap: 6px; /* Espacio entre el icono y el texto */
            background: #FFFFFF;
            padding: 6px 14px;
            border-radius: 20px;
            box-shadow: 0 2px 8px rgba(75, 145, 225, 0.1); /* Sombra */
        }

        .tarjeta-perfil {
            background-color: #FFFFFF;
            width: 100%; 
            max-width: 450px;
            border-radius: 25px; 
            padding: 30px 25px;
            /* box-shadow: Horizontal(0) Vertical(8px) Difuminado(25px) Color(Celeste transparente) */
            box-shadow: 0 8px 25px rgba(74, 144, 226, 0.15);
            text-align: center;
        }

        .titulo-perfil {
            font-family: 'Fredoka', sans-serif; 
            color: #4A90E2;
            font-size: 28px; /* Usamos píxeles en lugar de rem */
            margin-bottom: 25px;
        }

        /* --- ZONA DEL AVATAR --- */
        .contenedor-avatar { 
            margin-bottom: 25px; 
        }
        
        .circulo-foto {
            width: 110px; 
            height: 110px;
            background-color: #E8F2FC;
            border: 4px solid #4A90E2; 
            border-radius: 50%; /* Un border-radius de 50% convierte un cuadrado en un círculo perfecto */
            margin: 0 auto 15px; /* auto a los lados lo centra automáticamente en su contenedor */
            /* Flexbox aquí adentro centra el emoji gigante en el medio exacto del círculo */
            display: flex;
            align-items: center; 
            justify-content: center;
            font-size: 56px; 
            box-shadow: 0 4px 10px rgba(74, 144, 226, 0.2);
        }

        .btn-cambiar-foto {
            background-color: #93C5FD; 
            color: white;
            border: none; 
            padding: 8px 16px;
            border-radius: 15px; 
            font-weight: 700; 
            cursor: pointer;
            /* transition hace que cualquier cambio (como el clic) ocurra suavemente y no de golpe */
            transition: transform 0.1s ease;
        }

        /* :active significa "qué pasa en el momento exacto en que mantengo presionado el clic" */
        .btn-cambiar-foto:active { 
            /* scale(0.95) achica el botón un 5% para dar la sensación física de que se apretó */
            transform: scale(0.95); 
        }

        /* --- FORMULARIO --- */
        .grupo-input { 
            text-align: left; 
            margin-bottom: 18px;
            color:#333
        }
        
        .grupo-input label {
            display: block; /* block obliga al texto a ocupar toda la línea, empujando la caja para abajo */
            font-size: 15px; 
            color: #666;
            font-weight: 800; 
            margin-bottom: 8px;
        }

        .grupo-input input {
            width: 100%; 
            padding: 14px 18px;
            border: 2px solid transparent;
            border-color: #E2E8F0; 
            border-radius: 16px;
            background-color: #F3F8FF; 
            font-size: 16px;
            color: #333333; 
            font-weight: 700; 
            transition: all 0.2s ease;
            outline: none; /* Borra un borde negro y feo que el navegador le pone a las cajas por defecto */
        }

        /* :focus significa "qué pasa cuando el usuario está escribiendo dentro de esta caja" */
        .grupo-input input:focus {
            background-color: #FFFFFF; 
            border-color: #4A90E2;
            box-shadow: 0 4px 10px rgba(74, 144, 226, 0.1);
        }

        /* --- BOTÓN GUARDAR --- */
        .btn-guardar {
            width: 100%; 
            background-color: #4A90E2;
            color: white; 
            border: none; 
            padding: 16px;
            font-size: 19px; 
            font-weight: 800;
            border-radius: 20px; 
            margin-top: 15px;
            /* Le ponemos una sombra azul sólida hacia abajo para simular que es un botón 3D de plástico */
            box-shadow: 0 6px 0 #3A78C4; 
            cursor: pointer;
        }

        /* Efecto del botón gigante siendo presionado */
        .btn-guardar:active { 
            /* translateY mueve el botón 6 píxeles hacia abajo, ocupando el lugar de la sombra */
            transform: translateY(6px); 
            /* Borramos la sombra para que parezca que tocó el fondo de la pantalla */
            box-shadow: 0 0 0 #3A78C4; 
        }
    </style>
</head>
<body>

    <!-- Botón Volver a la pestaña principal de Juegos -->
    <div class="top-bar">
        <a href="perfil.html" class="btn-volver">← Volver</a> 
    </div>
    
    <div class="tarjeta-perfil">
        <h1 class="titulo-perfil">Tus Datos</h1>

        <div class="contenedor-avatar">
            <div class="circulo-foto">🧒🏽</div>
            <button class="btn-cambiar-foto">Cambiar foto</button>
        </div>

        <div class="grupo-input">
            <label>Nombre</label>
            <input type="text" placeholder="Ej: Ian" id="input-nombre">
        </div>

        <div class="grupo-input">
            <label>Apellido</label>
            <input type="text" placeholder="Ej: Pérez" id="input-apellido">
        </div>

         <div class="grupo-input">
            <label>DNI</label>
            <input type="text" placeholder="Ej: 12.345.678" id="input-dni">
        </div>

        <div class="grupo-input">
            <label>Edad</label>
            <input type="text" placeholder="Ej: 8" id="input-edad">
        </div>

         <div class="grupo-input">
            <label>Sexo</label>
            <input type="text" placeholder="¿Cuál es tu género?" id="input-sexo">
        </div>

        <button class="btn-guardar" id="btn-guardar-perfil">¡Guardar mis datos!</button>
    </div>


</body>
</html>
