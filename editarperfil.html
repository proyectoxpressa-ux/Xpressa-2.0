<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xpressa+ | Mi Perfil</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
    
    <style>
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            font-family: 'Nunito', sans-serif; 
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            /* Fondo de cielo relajante con degradado */
            background: linear-gradient(135deg, #a3ceef 0%, #e0f2fe 100%);
            min-height: 100vh;
            display: flex; 
            flex-direction: column; 
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* Burbujas decorativas de fondo */
        .burbuja {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.4);
            filter: blur(2px);
            z-index: -1;
        }
        .burbuja-1 { width: 160px; height: 160px; top: 5%; right: -40px; }
        .burbuja-2 { width: 250px; height: 250px; top: 50%; left: -80px; }
        .burbuja-3 { width: 130px; height: 130px; bottom: 8%; right: 30px; }
        .burbuja-4 { width: 80px; height: 80px; top: 15%; left: 15%; opacity: 0.6; }

        .top-bar {
            width: 100%;
            max-width: 750px;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            margin-bottom: 12px;
            z-index: 2;
        }

        .btn-volver {
            text-decoration: none; 
            color: #3B82F6; 
            font-family: 'Fredoka', sans-serif; 
            font-size: 1.1rem;
            background: #FFFFFF; 
            padding: 8px 20px; 
            border-radius: 20px; 
            display: inline-flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 6px 0 #E2E8F0, 0 10px 15px rgba(0,0,0,0.05); 
            transition: all 0.1s;
        }
        
        .btn-volver:active { 
            transform: translateY(6px); 
            box-shadow: 0 0 0 #E2E8F0; 
        }

        /* TARJETA HORIZONTAL */
        .tarjeta-perfil {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            width: 100%; 
            max-width: 750px; /* Más ancha para albergar el contenido en horizontal */
            border-radius: 40px; 
            padding: 30px 40px;
            box-shadow: 0 20px 40px rgba(59, 130, 246, 0.2), inset 0 0 0 5px #FFFFFF;
            border: 4px solid #E0F2FE;
            z-index: 2;
        }

        .titulo-perfil {
            font-family: 'Fredoka', sans-serif; 
            color: #1E3A8A;
            font-size: 2.2rem;
            margin-bottom: 20px;
            text-align: center;
        }

        /* DISEÑO DE DOS COLUMNAS */
        .cuerpo-horizontal {
            display: flex;
            gap: 35px;
            align-items: center;
        }

        /* COLUMNA IZQUIERDA: AVATAR */
        .columna-avatar {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex-shrink: 0;
            width: 160px;
        }

        .circulo-foto {
            width: 120px; 
            height: 120px;
            background-color: #E8F2FC;
            border: 4px solid #3B82F6; 
            border-radius: 50%;
            margin-bottom: 15px;
            display: flex;
            align-items: center; 
            justify-content: center;
            font-size: 60px; 
            box-shadow: 0 6px 15px rgba(59, 130, 246, 0.25);
        }

        .btn-cambiar-foto {
            background-color: #93C5FD; 
            color: white;
            border: none; 
            padding: 8px 16px;
            border-radius: 15px; 
            font-weight: 700; 
            cursor: pointer;
            box-shadow: 0 4px 0 #60A5FA;
            transition: transform 0.1s ease;
            width: 100%;
        }

        .btn-cambiar-foto:active { 
            transform: translateY(4px);
            box-shadow: 0 0 0 #60A5FA;
        }

        /* COLUMNA DERECHA: FORMULARIO EN GRILLA DE 2 COLUMNAS */
        .columna-formulario {
            flex-grow: 1;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .grupo-input { 
            text-align: left; 
            color: #333;
        }
        
        .grupo-input.ancho-completo {
            grid-column: span 2; /* Para que elementos como el botón ocupen todo el ancho */
        }

        .grupo-input label {
            display: block;
            font-size: 14px; 
            color: #64748B;
            font-weight: 800; 
            margin-bottom: 6px;
        }

        .grupo-input input, 
        .grupo-input select {
            width: 100%; 
            padding: 11px 15px;
            border: 2px solid #E2E8F0; 
            border-radius: 16px;
            background-color: #F3F8FF; 
            font-size: 15px;
            color: #333333; 
            font-weight: 700; 
            transition: all 0.2s ease;
            outline: none;
        }

        .grupo-input input:focus,
        .grupo-input select:focus {
            background-color: #FFFFFF; 
            border-color: #3B82F6;
            box-shadow: 0 4px 10px rgba(59, 130, 246, 0.15);
        }

        /* --- BOTÓN GUARDAR --- */
        .btn-guardar {
            width: 100%; 
            background-color: #3B82F6;
            color: white; 
            border: none; 
            padding: 14px;
            font-size: 1.2rem; 
            font-family: 'Fredoka', sans-serif;
            border-radius: 20px; 
            margin-top: 5px;
            box-shadow: 0 6px 0 #1D4ED8, 0 12px 15px rgba(59, 130, 246, 0.3); 
            cursor: pointer;
            transition: all 0.1s;
        }

        .btn-guardar:active { 
            transform: translateY(6px); 
            box-shadow: 0 0 0 #1D4ED8; 
        }

        /* Responsivo para celulares: si la pantalla es chica, vuelve a vertical automáticamente */
        @media (max-width: 650px) {
            .cuerpo-horizontal {
                flex-direction: column;
                gap: 20px;
            }
            .columna-formulario {
                grid-template-columns: 1fr;
                width: 100%;
            }
            .grupo-input.ancho-completo {
                grid-column: span 1;
            }
            .tarjeta-perfil {
                padding: 25px 20px;
            }
        }
    </style>
</head>
<body>

    <!-- Burbujas decorativas de fondo -->
    <div class="burbuja burbuja-1"></div>
    <div class="burbuja burbuja-2"></div>
    <div class="burbuja burbuja-3"></div>
    <div class="burbuja burbuja-4"></div>

    <!-- Botón Volver a la pestaña principal de Perfil -->
    <div class="top-bar">
        <a href="perfil.html" class="btn-volver"><span>←</span> Volver</a> 
    </div>
    
    <div class="tarjeta-perfil">
        <h1 class="titulo-perfil">Tus Datos</h1>

        <div class="cuerpo-horizontal">
            <!-- Columna Izquierda: Avatar -->
            <div class="columna-avatar">
                <div class="circulo-foto">🧒🏽</div>
                <button class="btn-cambiar-foto">Cambiar foto</button>
            </div>

            <!-- Columna Derecha: Formulario -->
            <div class="columna-formulario">
                <div class="grupo-input">
                    <label>Nombre</label>
                    <input type="text" placeholder="Ej: Ian" id="input-nombre">
                </div>

                <div class="grupo-input">
                    <label>Apellido</label>
                    <input type="text" placeholder="Ej: Pérez" id="input-apellido">
                </div>

                <div class="grupo-input">
                    <label>DNI</label>
                    <input type="text" placeholder="Ej: 12.345.678" id="input-dni">
                </div>

                <div class="grupo-input">
                    <label>Edad</label>
                    <input type="text" placeholder="Ej: 8" id="input-edad">
                </div>

                <div class="grupo-input ancho-completo">
                    <label>Sexo</label>
                    <select id="input-sexo">
                        <option value="" disabled selected>Seleccioná una opción</option>
                        <option value="Masculino">Masculino</option>
                        <option value="Femenino">Femenino</option>
                        <option value="Otro">Otro</option>
                    </select>
                </div>

                <div class="grupo-input ancho-completo">
                    <button class="btn-guardar" id="btn-guardar-perfil">¡Guardar mis datos! 🚀</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 1. Cargar los datos apenas se abre la pantalla
        document.addEventListener("DOMContentLoaded", async () => {
            const usuario_id = localStorage.getItem('usuario_id');
            const nombreGuardado = localStorage.getItem('nombre_usuario');
            
            if (!usuario_id) {
                window.location.href = 'sesion.html';
                return;
            }

            try {
                const respuesta = await fetch(`http://localhost:3000/api/perfil/${usuario_id}`);
                
                if (respuesta.ok) {
                    const datos = await respuesta.json();
                    
                    document.getElementById('input-nombre').value = datos.nombre || nombreGuardado || '';
                    document.getElementById('input-apellido').value = datos.apellido || '';
                    document.getElementById('input-dni').value = datos.dni || '';
                    document.getElementById('input-edad').value = datos.edad || '';
                    document.getElementById('input-sexo').value = datos.sexo || '';
                } else {
                    document.getElementById('input-nombre').value = nombreGuardado || '';
                }
            } catch (error) {
                console.error('Error cargando los datos:', error);
                document.getElementById('input-nombre').value = nombreGuardado || '';
            }
        });

        // 2. Guardar los datos al hacer clic en el botón
        document.getElementById('btn-guardar-perfil').addEventListener('click', async function() {
            const usuario_id = localStorage.getItem('usuario_id');
            
            if (!usuario_id) {
                alert('Debes iniciar sesión primero.');
                window.location.href = 'sesion.html';
                return;
            }

            const nombre = document.getElementById('input-nombre').value;
            const apellido = document.getElementById('input-apellido').value;
            const dni = document.getElementById('input-dni').value;
            const edad = document.getElementById('input-edad').value;
            const sexo = document.getElementById('input-sexo').value;

            try {
                const response = await fetch('http://localhost:3000/api/perfil', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ usuario_id, nombre, apellido, dni, edad, sexo })
                });

                const data = await response.json();

                if (response.ok) {
                    alert('¡Datos guardados con éxito!');
                    window.location.href = 'perfil.html';
                } else {
                    alert('Error: ' + data.mensaje);
                }
            } catch (error) {
                console.error('Error:', error);
                alert('No se pudo guardar el perfil.');
            }
        });
    </script>
</body>
</html>
