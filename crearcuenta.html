<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Cuenta — Xpressa+</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background: linear-gradient(180deg, #7DD3FC 0%, #E0F2FE 100%);
            background-attachment: fixed;
            animation: fondoMagico 10s ease infinite;
            display: flex; flex-direction: column; align-items: center;
            justify-content: center; 
            min-height: 100vh; 
            font-family: 'Nunito', sans-serif;
            position: relative; 
            padding: 20px;
            /* Por defecto (para niño) ocultamos el scroll para que quede fijo */
            overflow: hidden; 
        }

        /* Clase dinámica que activaremos por JS cuando sea profesional */
        body.con-scroll {
            overflow-y: auto;
            justify-content: flex-start; /* Permite scrollear desde arriba cómodamente */
        }

        .burbuja {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.4);
            filter: blur(2px);
            z-index: -1;
        }
        .burbuja-1 { width: 150px; height: 150px; top: -20px; right: -30px; }
        .burbuja-2 { width: 200px; height: 200px; top: 40%; left: -80px; }
        .burbuja-3 { width: 100px; height: 100px; bottom: 10%; right: 20px; }

        @keyframes fondoMagico { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }

        .caja-crearcuenta {
            background-color: #ffffff; width: 100%; max-width: 440px;
            padding: 35px 30px; border-radius: 35px; border: 4px solid #ffffff;
            box-shadow: 0 15px 35px rgba(59, 130, 246, 0.2), 0 0 0 8px rgba(255,255,255,0.4);
            text-align: center; display: flex; flex-direction: column; gap: 15px;
            margin: auto 0; /* Centra la caja verticalmente si sobra espacio */
        }

        .emoji-header { font-size: 3rem; margin-bottom: -10px; }

        .caja-crearcuenta h1 {
            color: #3B82F6; font-family: 'Fredoka', sans-serif;
            font-size: 2.1rem; font-weight: 700;
        }

        /* Selector de Rol (Tabs) */
        .selector-rol { display: flex; background: #F1F5F9; border-radius: 20px; padding: 5px; gap: 5px; border: 2px solid #E2E8F0; }
        .btn-rol {
            flex: 1; background: transparent; border: none; padding: 10px; border-radius: 15px;
            font-family: 'Fredoka', sans-serif; font-size: 0.95rem; color: #64748B; cursor: pointer; transition: all 0.2s;
        }
        .btn-rol.activo { background: #3B82F6; color: #FFFFFF; box-shadow: 0 4px 10px rgba(59, 130, 246, 0.3); }

        form { display: flex; flex-direction: column; gap: 14px; width: 100%; }

        .form-group { text-align: left; }
        .form-label {
            font-size: 0.95rem; font-weight: 800; color: #64748B;
            margin-bottom: 5px; display: inline-block; margin-left: 5px;
        }

        .input-texto {
            width: 100%; padding: 13px 16px; background-color: #F8FAFC;
            border-radius: 20px; border: 3px solid #E2E8F0;
            font-size: 1.05rem; font-weight: 700; color: #334155; transition: all 0.3s;
        }
        .input-texto::placeholder { color: #CBD5E1; }
        .input-texto:focus {
           outline: none; border-color: #3B82F6; background-color: #ffffff;
           box-shadow: 0 0 0 6px rgba(59, 130, 246, 0.15); transform: scale(1.01);  
        }

        /* Sección exclusiva para profesionales */
        #seccion-profesional {
            display: none; flex-direction: column; gap: 12px;
            background: #EFF6FF; padding: 16px; border-radius: 22px; border: 2px dashed #BFDBFE;
            text-align: left;
        }

        /* Contenedor dinámico de carga de archivo */
        .upload-wrapper {
            position: relative;
            width: 100%;
        }

        .btn-subir-custom {
            display: flex; align-items: center; justify-content: center; gap: 8px;
            width: 100%; padding: 13px 16px; background-color: #ffffff;
            border-radius: 20px; border: 3px dashed #3B82F6;
            font-size: 0.95rem; font-weight: 700; color: #3B82F6;
            cursor: pointer; transition: all 0.2s; text-align: center;
        }
        .btn-subir-custom:hover { background-color: #EFF6FF; }

        /* Contenedor del archivo ya seleccionado */
        #archivo-seleccionado-box {
            display: none; align-items: center; justify-content: space-between;
            background: #ffffff; padding: 10px 15px; border-radius: 18px;
            border: 3px solid #10B981; font-weight: 700; font-size: 0.95rem; color: #065F46;
        }
        .nombre-archivo { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 240px; }
        
        .btn-borrar-archivo {
            background: #EF4444; color: white; border: none; width: 28px; height: 28px;
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-size: 0.9rem; cursor: pointer; transition: transform 0.1s; flex-shrink: 0;
        }
        .btn-borrar-archivo:active { transform: scale(0.9); }

        .btn-crearcuenta {
            background-color: #3B82F6;
            color: #ffffff; width: 100%; padding: 15px;
            margin-top: 5px; border: none; border-radius: 22px;
            font-family: 'Fredoka', sans-serif; font-size: 1.25rem;
            cursor: pointer; transition: all 0.1s;
            box-shadow: 0 6px 0 #1D4ED8, 0 12px 18px rgba(59, 130, 246, 0.3);
        }
        .btn-crearcuenta:active {
            transform: translateY(6px); box-shadow: 0 0 0 #3B82F6;
        }

        .caja-crearcuenta h3 { font-size: 0.95rem; font-weight: 700; color: #94A3B8; margin-top: 5px; }
        .caja-crearcuenta h3 a { color: #3B82F6; text-decoration: none; font-weight: 800; }
    </style>
</head>
<body>

    <div class="burbuja burbuja-1"></div>
    <div class="burbuja burbuja-2"></div>
    <div class="burbuja burbuja-3"></div>
    
    <div class="caja-crearcuenta">
        <div class="emoji-header">🚀</div>
        <h1>¡Sumate!</h1>

        <!-- Selector de Rol estilo Píldora -->
        <div class="selector-rol">
            <button type="button" class="btn-rol activo" id="tab-paciente" onclick="cambiarRol('paciente')">🧒 Niño</button>
            <button type="button" class="btn-rol" id="tab-profesional" onclick="cambiarRol('profesional')">🩺 Fonoaudiólogo</button>
        </div>

        <form id="form-registro" onsubmit="registrarUsuario(event)">
            <div class="form-group">
                <label class="form-label" id="label-nombre" for="username">Nombre de Héroe</label>
                <input class="input-texto" type="text" id="username" name="username" placeholder="Ej: Lihuel" required>
            </div>
            
            <div class="form-group">
                <label class="form-label" for="email">Correo Electrónico</label>
                <input class="input-texto" type="email" id="email" name="email" placeholder="correo@ejemplo.com" required>
            </div>

            <div class="form-group">
                <label class="form-label" for="password">Contraseña</label>
                <div style="position: relative;">
                    <input class="input-texto" type="password" id="password" name="password" placeholder="••••••••" required style="padding-right: 45px;">
                    <div id="btn-ojo" style="position: absolute; right: 15px; top: 50%; transform: translateY(-50%); cursor: pointer; color: #94A3B8; display: flex;">
                        <svg id="ojo-cerrado" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
                        <svg id="ojo-abierto" style="display: none;" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                    </div>
                </div>
            </div>

            <!-- EXCLUSIVO PARA PROFESIONALES -->
            <div id="seccion-profesional">
                <div class="form-group">
                    <label class="form-label" style="color: #1E3A8A;" for="matricula">Número de Matrícula</label>
                    <input class="input-texto" type="text" id="matricula" placeholder="Ej: 462 0 1934" style="background: white;">
                </div>
                
                <div class="form-group">
                    <label class="form-label" style="color: #1E3A8A;">Credencial o Título</label>
                    <div class="upload-wrapper">
                        <!-- Input nativo oculto -->
                        <input type="file" id="credencial" accept="image/*,application/pdf" style="display: none;" onchange="manejarArchivo(this)">
                        
                        <!-- Botón personalizado para seleccionar archivo -->
                        <button type="button" class="btn-subir-custom" id="btn-seleccionar" onclick="document.getElementById('credencial').click()">
                            Adjuntar Archivo
                        </button>

                        <!-- Caja que aparece cuando el archivo ya está cargado -->
                        <div id="archivo-seleccionado-box">
                            <span class="nombre-archivo" id="nombre-archivo-texto">documento.pdf</span>
                            <button type="button" class="btn-borrar-archivo" onclick="borrarArchivo()" title="Borrar archivo">✕</button>
                        </div>
                    </div>
                </div>
            </div>

            <button type="submit" class="btn-crearcuenta" id="btn-texto">Crear Cuenta</button>
            <h3>¿Ya tienes cuenta? <a href="sesion.html">Inicia Sesión</a></h3>
        </form>
    </div>

    <script>
        let rolActual = 'paciente';

        function cambiarRol(rol) {
            rolActual = rol;
            const tabPaciente = document.getElementById('tab-paciente');
            const tabProfesional = document.getElementById('tab-profesional');
            const seccionProf = document.getElementById('seccion-profesional');
            const btnTexto = document.getElementById('btn-texto');
            const labelNombre = document.getElementById('label-nombre');

            if (rol === 'paciente') {
                tabPaciente.classList.add('activo');
                tabProfesional.classList.remove('activo');
                seccionProf.style.display = 'none';
                btnTexto.textContent = 'Crear Cuenta';
                labelNombre.textContent = 'Nombre de Héroe';
                
                // Quitamos el scroll cuando es niño
                document.body.classList.remove('con-scroll');
            } else {
                tabProfesional.classList.add('activo');
                tabPaciente.classList.remove('activo');
                seccionProf.style.display = 'flex';
                btnTexto.textContent = 'Crear Cuenta Profesional';
                labelNombre.textContent = 'Nombre y Apellido';
                
                // Añadimos el scroll cuando es profesional para que se vea todo el contenido sin desbordarse
                document.body.classList.add('con-scroll');
            }
        }

        // Manejo dinámico de la selección del archivo
        function manejarArchivo(input) {
            if (input.files && input.files[0]) {
                const nombreArchivo = input.files[0].name;
                document.getElementById('nombre-archivo-texto').textContent = nombreArchivo;
                
                document.getElementById('btn-seleccionar').style.display = 'none';
                document.getElementById('archivo-seleccionado-box').style.display = 'flex';
            }
        }

        // Función para borrar el archivo seleccionado
        function borrarArchivo() {
            const inputCredencial = document.getElementById('credencial');
            inputCredencial.value = ''; 

            document.getElementById('archivo-seleccionado-box').style.display = 'none';
            document.getElementById('btn-seleccionar').style.display = 'flex';
        }

        async function registrarUsuario(event) {
            event.preventDefault();
            const username = document.getElementById('username').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            const formData = new FormData();
            formData.append('username', username);
            formData.append('email', email);
            formData.append('password', password);
            formData.append('rol', rolActual);

            if (rolActual === 'profesional') {
                const matricula = document.getElementById('matricula').value;
                const credencialInput = document.getElementById('credencial');
                
                if (!matricula) {
                    alert('Por favor, ingresa tu número de matrícula.');
                    return;
                }
                if (credencialInput.files.length === 0) {
                    alert('Por favor, adjunta la foto de tu credencial o título profesional.');
                    return;
                }

                formData.append('matricula', matricula);
                formData.append('credencial', credencialInput.files[0]);
            }

            try {
                const respuesta = await fetch('http://localhost:3000/api/registro', {
                    method: 'POST',
                    body: formData 
                });
                const data = await respuesta.json();
                
                if (respuesta.ok) {
                    if (rolActual === 'profesional') {
                        alert(`¡Solicitud recibida, Dr./Dra. ${username}! Tu cuenta ha quedado en estado PENDIENTE de aprobación.`);
                    } else {
                        alert('¡Cuenta creada con éxito!');
                    }
                    window.location.href = 'sesion.html';
                } else { 
                    alert('Error: ' + data.mensaje); 
                }
            } catch (error) { 
                console.error('Error:', error); 
                alert('No se pudo conectar con el servidor.'); 
            }
        }
        
        document.getElementById('btn-ojo').addEventListener('click', function() {
            const inputPass = document.getElementById('password');
            const ojoAbierto = document.getElementById('ojo-abierto');
            const ojoCerrado = document.getElementById('ojo-cerrado');
            
            if (inputPass.type === 'password') {
                inputPass.type = 'text';
                ojoCerrado.style.display = 'none';
                ojoAbierto.style.display = 'block';
            } else {
                inputPass.type = 'password';
                ojoAbierto.style.display = 'none';
                ojoCerrado.style.display = 'block';
            }
        });
    </script>
</body>
</html>
