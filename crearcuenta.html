<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Cuenta</title>
    <style>
        body {
            font-family: Arial, sans-serif; background-color: #82cbff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .caja-crearcuenta {
            text-align: center;
            background-color: #F0F8FF;
            padding: 20px;
            border-radius: 10px;
        }
        
        form {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        label, input, button {
            margin: 10px 0;
        }
        
        
        label, input, button {
            margin: 10px 0;
        }

        .btn-crearcuenta {
            width: 100%;
            padding: 10px;
            margin: 5px 0;
            border: 1px solid #ccc;
            border-radius: 20px;
        }

        .btn-crearcuenta:hover {
            border-color: #acacad;
            background-color: #eeeff3;
            transition: background-color 1s, border-color 0.3s;
            box-shadow: 0 8px 10px rgba(0, 0, 0, 0.1);
            border-radius: 20px;
        }
        .form-label {
            font-weight: bold;
            align-self: flex-start;
        }
    </style>
</head>
<body>
    <div class="caja-crearcuenta">
        <h1>Crear Cuenta</h1>
        <form action="/register" method="POST">
            <label  class="form-label" for="username">Nombre:</label>
            <input  class="btn-crearcuenta" type="text" id="username" name="username" required><br><br>

            <label class="form-label" for="email">Correo Electrónico:</label>
            <input class="btn-crearcuenta" type="email" id="email" name="email" required><br><br>

            <label class="form-label" for="password">Contraseña:</label>
            <input class="btn-crearcuenta" type="password" id="password" name="password" required><br><br>

            <button class="btn-crearcuenta" onclick="location.href='sesion.html'">Crear Cuenta</button>
            <h2>¿Ya tienes cuenta? <a href="sesion.html">Iniciar Sesión</a></h2>
        </form>
    </div>
</body>
</html>
