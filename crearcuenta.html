<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Cuenta</title>

    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            font-family: 'Nunito', sans-serif;
        }
        
        body {
            background-color: #5C9CE6;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }

        

        .caja-crearcuenta {
            text-align: center;
            background-color: #ffffff;
            padding: 40px;
            border-radius: 25px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);

        }
        
        form {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        .form-label {
            font-weight: bold;
            align-self: flex-start;
            color: #555;
        }
        
        .input-texto {
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            background-color: #F0F8FF;
            border-radius: 20px;
            border: 2px solid #E8F2FC;
        }

        .input-texto:focus {
            outline: none;
            border-color: #4A90E2;
            box-shadow: 0 0 5px rgba(74, 144, 226, 0.5);
        }


        .btn-crearcuenta {
            background-color: #4A90E2;
            color: #ffffff;
            width: 100%;
            padding: 15px;
            margin: 15px ;
            border: none;
            border-radius: 20px;
            border-color: #acacad;
            transition: transform 0.1s, box-shadow 0.3s;
        }

        .btn-crearcuenta:active {
            transform: translateY(2px);
            box-shadow: 0 6px 0px rgba(0, 0, 0, 0.1);
        }
        
    </style>
</head>
<body>
    <div class="caja-crearcuenta">
        <h1>Crear Cuenta</h1>
        <form action="/register" method="POST">
            <label  class="form-label" for="username">Nombre:</label>
            <input  class="input-texto" type="text" id="username" name="username" required><br><br>

            <label class="form-label" for="email">Correo Electrónico:</label>
            <input class="input-texto" type="email" id="email" name="email" required><br><br>

            <label class="form-label" for="password">Contraseña:</label>
            <input class="input-texto" type="password" id="password" name="password" required><br><br>

            <button class="btn-crearcuenta" onclick="location.href='sesion.html'">Crear Cuenta</button>
            <h3>¿Ya tienes cuenta? <a href="sesion.html">Iniciar Sesión</a></h3>
        </form>
    </div>
</body>
</html>
