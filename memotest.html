<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xpressa+ | Memotest</title>

    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<style>
        body { font-family: 'Comic Sans MS', sans-serif; text-align: center; background-color: #e8f5e9; }
        
        #tablero {
            display: grid;
            grid-template-columns: repeat(4, 120px); /* 4 columnas de 120px cada una */
            gap: 15px;
            justify-content: center;
            margin: 20px auto;
        }

        .carta {
        
            /* Tamaño fijo para que la grilla sea perfecta */
            width: 110px;  
            height: 110px; 
            /* ... el resto de tus estilos (colores, bordes) ... */
            display: flex; /* Importante para centrar la imagen dentro */
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #7db6f6;
            border: 3px solid #4A90E2;
            border-radius: 12px;
            cursor: pointer;
            user-select: none; /* Evita que el texto se seleccione al hacer clic */
        }

        .carta:hover { transform: scale(1.05); }

        .carta.revelada, .carta.emparejada {
            background-color: #ffffff;
            border: 3px solid  #4A90E2;
            cursor: default;
        }

        .carta.emparejada {
            box-shadow: 0 0 15px #4caf50;
            border: 3px solid #4caf50; /* Efecto de resplandor para las cartas emparejadas */
        }

        /* Esto asegura que la imagen se adapte al tamaño de la carta */
        .carta img {
            width: 65%;            /* Ocupa el 65% del ancho de la carta */
            height: 65%;           /* Ocupa el 65% del alto */
            object-fit: contain;   /* Mantiene la proporción sin estirarse */
            pointer-events: none;  /* Evita que la imagen reciba clics */

        }

        .carta span {
            font-size: 15px;
            font-weight: bold;
            color: #333;
            margin-top: 4px;
            text-transform: capitalize; /* Asegura que la primera letra sea mayúscula */
        }
    </style>
</head>
<body>

   <h1 id="titulo-juego">Memotest</h1>
    <div id="tablero"></div>

    <script>
        // 1. BANCO DE DATOS
       const bancoDeImagenes = {
        'R': [
            { id: 'perro', contenido: '../imagenes/perrito.png' },
            { id: 'gorra', contenido: '../imagenes/gorra.png' },
            { id: 'raton', contenido: '../imagenes/raton.png' },
            { id: 'robot', contenido: '../imagenes/robot.png' }
        
        ],
         'TR': [
            { id: 'tren',  contenido: '../imagenes/tren.png' },
            { id: 'tractor',  contenido: '../imagenes/tractor.png' },
            { id: 'trofeo',  contenido: '../imagenes/trofeo.png' },
            { id: 'trueno',  contenido: '../imagenes/trueno.png' }

        ],
        'PR': [
            { id: 'primavera', contenido: '../imagenes/primavera.png' },
            { id: 'princesa', contenido: '../imagenes/princesa.png' },
            { id: 'prenda',  contenido: '../imagenes/prenda.png' },
            { id: 'compra',  contenido: '../imagenes/compra.png' }
        ],
        'DR': [
            { id: 'dragon', contenido: '../imagenes/dragon.png' },
            { id: 'ajedrez',  contenido: '../imagenes/ajedrez.png' },
            { id: 'almendra', contenido: '../imagenes/almendra.png' },
            { id: 'piedra', contenido: '../imagenes/piedra.png' }
        ],
        'PL': [
            { id: 'planta', contenido: '../imagenes/planta.png' },
            { id: 'plato',  contenido: '../imagenes/plato.png' },
            { id: 'playa',  contenido: '../imagenes/playa.png' },
            { id: 'planeta',  contenido: '../imagenes/planeta.png' }
        ],
        'C': [
            { id: 'cuchara', contenido: '../imagenes/cuchara.png' },
            { id: 'casa',    contenido: '../imagenes/casa.png' },
            { id: 'caballo',   contenido: '../imagenes/caballo.png' },
            { id: 'conejo',   contenido: '../imagenes/conejo.png' }
        ]
    
        };
        // 2. LEER LOCALSTORAGE
        let sonido = localStorage.getItem("sonidoMemotest") || "R";
        document.getElementById("titulo-juego").innerText = `Entrenando el Sonido "${sonido}"`;

        // 3. ARMAR EL MAZO (Fijo: 3 parejas = 6 cartas)
        let cartasElegidas = bancoDeImagenes[sonido];
        let mazo = [...cartasElegidas, ...cartasElegidas]; // Duplicamos para los pares
        mazo.sort(() => Math.random() - 0.5); // Mezclamos aleatoriamente

        // 4. DIBUJAR TABLERO
        const tablero = document.getElementById("tablero");

        mazo.forEach((item, indice) => {
            let cartaHTML = document.createElement("div");
            cartaHTML.classList.add("carta");
            cartaHTML.dataset.id = item.id;
            cartaHTML.dataset.contenido = item.contenido;
            cartaHTML.innerText = "❓";
            
            cartaHTML.addEventListener("click", voltearCarta);
            tablero.appendChild(cartaHTML);
        });

        // 5. LÓGICA DE JUEGO
        let cartasVolteadas = [];
        let bloqueado = false;

        function voltearCarta() {
            if (bloqueado) return;
            if (this.classList.contains("revelada") || this.classList.contains("emparejada")) return;

            // AHORA INYECTAMOS UN TAG <img>
            this.innerHTML = `<img src="${this.dataset.contenido}" alt="${this.dataset.id}">
            <span>${this.dataset.id}</span>`;
            this.classList.add("revelada");
            cartasVolteadas.push(this);

            if (cartasVolteadas.length === 2) {
                compararPareja();
            }
        }

        function compararPareja() {
            bloqueado = true;
            let [carta1, carta2] = cartasVolteadas;

            if (carta1.dataset.id === carta2.dataset.id) {
                carta1.classList.add("emparejada");
                carta2.classList.add("emparejada");
                cartasVolteadas = [];
                bloqueado = false;
                verificarVictoria();
            } else {
                setTimeout(() => {
                    // VOLVEMOS A PONER EL SIGNO O EL DORSO EN INNERHTML
                    carta1.innerHTML = "❓";
                    carta2.innerHTML = "❓";
                    carta1.classList.remove("revelada");
                    carta2.classList.remove("revelada");
                    cartasVolteadas = [];
                    bloqueado = false;
                }, 1000);
            }
        }

        function verificarVictoria() {
            let totalEmparejadas = document.querySelectorAll(".emparejada").length;
            if (totalEmparejadas === mazo.length) {
                setTimeout(() => {
                    alert("¡¡GANASTE!! 🏆 ¡Muy bien hecho!");
                    window.location.href = "lobby-memotest.html"; // Vuelve a la selección
                }, 400);
            }
        }
    </script>
</body>
</html>
