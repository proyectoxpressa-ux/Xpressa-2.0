<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xpressa+ · Memotest</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700;800&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-sky: #DCF0FF;
            --primary-blue: #4A90E2;
            --text-dark: #2A4365;
            --card-border: #9DC7F8;
            --green-match: #34C759;
            --green-glow: rgba(52, 199, 89, 0.45);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Nunito', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-sky);
            color: var(--text-dark);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 12px 16px 25px;
        }

        .screen-container {
            width: 100%;
            max-width: 440px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .top-bar {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        .tag-back {
            text-decoration: none;
            background: rgba(255, 255, 255, 0.85);
            color: var(--primary-blue);
            font-size: 0.95rem;
            font-weight: 800;
            padding: 6px 14px;
            border-radius: 20px;
            box-shadow: 0 2px 6px rgba(74, 144, 226, 0.15);
        }

        .stars-badge {
            background: white;
            border: 2px solid #82BEFA;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 4px 12px;
            font-size: 0.9rem;
        }

        .game-title {
            font-family: 'Fredoka', sans-serif;
            font-size: 2.1rem;
            color: #3C6FA8;
            margin: 4px 0 10px;
        }

        .instruction-card {
            background: #FFFFFF;
            border: 3px solid #80BFFF;
            border-radius: 24px;
            padding: 12px 18px;
            text-align: center;
            width: 100%;
            box-shadow: 0 6px 16px rgba(74, 144, 226, 0.1);
            margin-bottom: 16px;
        }

        .instruction-card p {
            font-size: 0.95rem;
            font-weight: 800;
            color: #2D3748;
            line-height: 1.4;
        }

        /* --- GRILLA DEL MEMOTEST --- */
        .memo-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            width: 100%;
        }

        /* Checkboxes ocultos para controlar el juego */
        input[type="checkbox"] {
            display: none;
        }

        .memo-card-wrapper {
            aspect-ratio: 1 / 1.15;
            perspective: 800px;
            display: block;
        }

        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            border-radius: 20px;
            transform-style: preserve-3d;
            cursor: pointer;
            transition: transform 0.45s cubic-bezier(0.4, 0, 0.2, 1);
            
            /* REQUISITO 1: Revelación automática por 2 segundos al inicio */
            animation: introPeek 2.3s forwards ease-in-out;
        }

        @keyframes introPeek {
            0%, 75% {
                transform: rotateY(180deg); /* Se ven boca arriba los primeros 2s */
                pointer-events: none;       /* Evita clicks accidentales mientras se muestran */
            }
            100% {
                transform: rotateY(0deg);   /* Se dan vuelta para comenzar el juego */
                pointer-events: auto;
            }
        }

        /* Al hacer click en una carta, se gira */
        .memo-card-wrapper:has(input[type="checkbox"]:checked) .card-inner {
            transform: rotateY(180deg);
        }

        .card-front, .card-back {
            position: absolute;
            inset: 0;
            border-radius: 20px;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }

        /* Dorso oculto (Pregunta) */
        .card-front {
            background: #FFFFFF;
            border: 3px solid var(--card-border);
            box-shadow: 0 4px 10px rgba(74, 144, 226, 0.12);
        }

        .card-front::after {
            content: "❓";
            font-size: 2rem;
            opacity: 0.35;
        }

        /* Cara del animal descubierta */
        .card-back {
            background: #FFFFFF;
            border: 3px solid #63A9F7;
            transform: rotateY(180deg);
            padding: 8px 4px;
            box-shadow: 0 4px 12px rgba(74, 144, 226, 0.2);
        }

        .card-back .emoji { font-size: 2.7rem; }
        .card-back .word {
            font-family: 'Fredoka', sans-serif;
            font-size: 1.05rem;
            font-weight: 700;
            color: #3C6FA8;
            margin-top: 2px;
        }

        /* --- REQUISITO 2: VALIDACIÓN DE PAREJAS Y VUELTA AUTOMÁTICA --- */

        /* Pareja 1: Perro (c-perro-1 y c-perro-2) */
        body:has(#c-perro-1:checked):has(#c-perro-2:checked) .match-perro .card-inner {
            transform: rotateY(180deg) !important;
            pointer-events: none;
        }
        body:has(#c-perro-1:checked):has(#c-perro-2:checked) .match-perro .card-back {
            border-color: var(--green-match) !important;
            border-width: 4px;
            box-shadow: 0 0 14px var(--green-glow);
        }

        /* Pareja 2: Carro (c-carro-1 y c-carro-2) */
        body:has(#c-carro-1:checked):has(#c-carro-2:checked) .match-carro .card-inner {
            transform: rotateY(180deg) !important;
            pointer-events: none;
        }
        body:has(#c-carro-1:checked):has(#c-carro-2:checked) .match-carro .card-back {
            border-color: var(--green-match) !important;
            border-width: 4px;
            box-shadow: 0 0 14px var(--green-glow);
        }

        /* Pareja 3: Reloj (c-reloj-1 y c-reloj-2) */
        body:has(#c-reloj-1:checked):has(#c-reloj-2:checked) .match-reloj .card-inner {
            transform: rotateY(180deg) !important;
            pointer-events: none;
        }
        body:has(#c-reloj-1:checked):has(#c-reloj-2:checked) .match-reloj .card-back {
            border-color: var(--green-match) !important;
            border-width: 4px;
            box-shadow: 0 0 14px var(--green-glow);
        }

        /* REGLA DE DESACIERTO / RESET:
           Si se abre una carta incorrecta que no tiene su par activo,
           se activa un timer visual por CSS que regresa la carta a su estado original */
        .memo-card-wrapper input[type="checkbox"]:checked + .card-inner {
            animation: flipTemporarily 2.5s forwards ease-in-out;
        }

        @keyframes flipTemporarily {
            0%, 80% {
                transform: rotateY(180deg);
            }
            100% {
                transform: rotateY(0deg);
            }
        }

        /* Si coincide la pareja, cancelamos el retorno y se queda fija para arriba */
        body:has(#c-perro-1:checked):has(#c-perro-2:checked) .match-perro .card-inner,
        body:has(#c-carro-1:checked):has(#c-carro-2:checked) .match-carro .card-inner,
        body:has(#c-reloj-1:checked):has(#c-reloj-2:checked) .match-reloj .card-inner {
            animation: none !important;
        }

        /* Mensaje de Victoria cuando todas las parejas están completas */
        .toast-win {
            display: none;
            margin-top: 18px;
            background: var(--green-match);
            color: white;
            padding: 12px 24px;
            border-radius: 30px;
            font-family: 'Fredoka', sans-serif;
            font-size: 1.1rem;
            font-weight: 700;
            box-shadow: 0 8px 18px var(--green-glow);
        }

        body:has(#c-perro-1:checked):has(#c-perro-2:checked):has(#c-carro-1:checked):has(#c-carro-2:checked):has(#c-reloj-1:checked):has(#c-reloj-2:checked) .toast-win {
            display: block;
        }

        .footer-banner {
            margin-top: 18px;
            background: #FFFFFF;
            border: 2px dashed #80BFFF;
            border-radius: 20px;
            padding: 10px 18px;
            width: 100%;
            text-align: center;
            font-weight: 800;
            color: #3C6FA8;
            font-size: 0.95rem;
        }
    </style>
</head>
<body>
    <div class="screen-container">
        <header class="top-bar">
            <a href="Juego.html" class="tag-back">← Volver</a>
            <div class="stars-badge">⭐ ⭐ ⭐ ⭐ ⭐</div>
        </header>

        <h1 class="game-title">Memotest</h1>

        <div class="instruction-card">
            <p>Encontrá las imágenes iguales y ejercitá tu memoria mientras practicás diferentes sonidos y palabras.</p>
        </div>

        <main class="memo-grid">
            <!-- Posición 1: Perro (Pareja 1) -->
            <label class="memo-card-wrapper match-perro">
                <input type="checkbox" id="c-perro-1">
                <div class="card-inner">
                    <div class="card-front"></div>
                    <div class="card-back"><span class="emoji">🐶</span><span class="word">Perro</span></div>
                </div>
            </label>

            <!-- Posición 2: Reloj (Pareja 3) -->
            <label class="memo-card-wrapper match-reloj">
                <input type="checkbox" id="c-reloj-1">
                <div class="card-inner">
                    <div class="card-front"></div>
                    <div class="card-back"><span class="emoji">⏰</span><span class="word">Reloj</span></div>
                </div>
            </label>

            <!-- Posición 3: Carro (Pareja 2) -->
            <label class="memo-card-wrapper match-carro">
                <input type="checkbox" id="c-carro-1">
                <div class="card-inner">
                    <div class="card-front"></div>
                    <div class="card-back"><span class="emoji">🚗</span><span class="word">Carro</span></div>
                </div>
            </label>

            <!-- Posición 4: Carro (Pareja 2) -->
            <label class="memo-card-wrapper match-carro">
                <input type="checkbox" id="c-carro-2">
                <div class="card-inner">
                    <div class="card-front"></div>
                    <div class="card-back"><span class="emoji">🚗</span><span class="word">Carro</span></div>
                </div>
            </label>

            <!-- Posición 5: Pera (Decorativa/Distractor) -->
            <label class="memo-card-wrapper">
                <input type="checkbox">
                <div class="card-inner">
                    <div class="card-front"></div>
                    <div class="card-back"><span class="emoji">🍐</span><span class="word">Pera</span></div>
                </div>
            </label>

            <!-- Posición 6: Reloj (Pareja 3) -->
            <label class="memo-card-wrapper match-reloj">
                <input type="checkbox" id="c-reloj-2">
                <div class="card-inner">
                    <div class="card-front"></div>
                    <div class="card-back"><span class="emoji">⏰</span><span class="word">Reloj</span></div>
                </div>
            </label>

            <!-- Posición 7: Rama (Decorativa/Distractor) -->
            <label class="memo-card-wrapper">
                <input type="checkbox">
                <div class="card-inner">
                    <div class="card-front"></div>
                    <div class="card-back"><span class="emoji">🌿</span><span class="word">Rama</span></div>
                </div>
            </label>

            <!-- Posición 8: León (Decorativo/Distractor) -->
            <label class="memo-card-wrapper">
                <input type="checkbox">
                <div class="card-inner">
                    <div class="card-front"></div>
                    <div class="card-back"><span class="emoji">🦁</span><span class="word">León</span></div>
                </div>
            </label>

            <!-- Posición 9: Perro (Pareja 1) -->
            <label class="memo-card-wrapper match-perro">
                <input type="checkbox" id="c-perro-2">
                <div class="card-inner">
                    <div class="card-front"></div>
                    <div class="card-back"><span class="emoji">🐶</span><span class="word">Perro</span></div>
                </div>
            </label>
        </main>

        <div class="toast-win">🎉 ¡Excelente memoria! Completaste las parejas ⭐</div>

        <div class="footer-banner">
            ¡Completá todas las parejas y conseguí estrellas! ⭐
        </div>
    </div>
</body>
</html>
