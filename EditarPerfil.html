<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Perfil - FonoApp (Dislalia)</title>
    <!-- Importamos la fuente Nunito -->
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Nunito', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --bg-color: #F8FAFC;        /* Fondo muy sutil y limpio */
            --primary-blue: #4A90E2;    /* Azul principal vibrante */
            --light-blue: #5C9CE6;      /* Azul de apoyo */
            --card-bg: #FFFFFF;         /* Blanco para contraste */
            --text-dark: #333333;       /* Texto oscuro */
            --gray-border: #E2E8F0;     /* Bordes sutiles */
            --shadow: 0 4px 12px rgba(74, 144, 226, 0.08); 
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-dark);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            padding-bottom: 90px; /* Espacio para la barra de navegación inferior */
        }

        /* Cabecera superior estilo app de diseño limpio */
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1rem 1.5rem;
            background-color: var(--card-bg);
            color: var(--text-dark);
            font-size: 1.1rem;
            font-weight: 700;
            border-bottom: 1px solid var(--gray-border);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .header-btn-left{
            background: none;
            border: none;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
        }

        .header-btn-left {
            color: var(--primary-blue);
            font-size: 1.4rem;
        }

        .header-btn-right {
            color: var(--primary-blue);
        }

        .header-title {
            font-weight: 800;
            color: var(--text-dark);
            /* Estas 3 líneas nuevas lo clavan exactamente en el centro */
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
        }

        /* Contenedor principal */
        main {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem 1.5rem;
        }

        form {
            width: 100%;
            max-width: 700px;
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
        }

        /* Sección de Avatar */
        .profile-avatar-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 1rem;
        }

        .avatar-circle {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background-color: var(--primary-blue);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 3rem;
            box-shadow: 0 4px 10px rgba(74, 144, 226, 0.2);
            margin-bottom: 0.8rem;
        }

        .btn-change-photo {
            background-color: var(--primary-blue);
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 2px 6px rgba(74, 144, 226, 0.3);
            transition: opacity 0.2s;
        }

        .btn-change-photo:hover {
            opacity: 0.9;
        }

        /* Campos de formulario */
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        label {
            font-weight: 700;
            font-size: 0.9rem;
            color: var(--text-dark);
        }

        input {
            width: 100%;
            padding: 0.8rem 1rem;
            border: 1px solid var(--gray-border);
            border-radius: 8px;
            font-size: 1rem;
            color: var(--text-dark);
            background-color: var(--card-bg);
            outline: none;
            box-shadow: 0 1px 2px rgba(0,0,0,0.02);
            transition: all 0.3s ease;
        }

        input:focus {
            border-color: var(--primary-blue);
            box-shadow: 0 0 0 3px rgba(74, 144, 226, 0.15);
        }

        /* Botón inferior principal estilo ancho */
        .btn-submit-large {
            margin-top: 1rem;
            background-color: var(--primary-blue);
            color: white;
            border: none;
            padding: 0.9rem 1.5rem;
            font-size: 1rem;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(74, 144, 226, 0.25);
            transition: opacity 0.2s ease;
            text-align: center;
        }

        .btn-submit-large:hover {
            opacity: 0.95;
        }

    </style>
</head>
<body>

    <!-- Cabecera superior basada en tu imagen de referencia -->
    <header>
        <a href="Perfil.html" class="header-btn-left">✕</a>
        <span class="header-title">Editar Perfil</span>
    </header>

    <main>
        <form id="profile-form" action="/editar_perfil" method="POST">
            
            <!-- Avatar y botón de cambiar foto -->
            <div class="profile-avatar-section">
                <div class="avatar-circle">
                    👤
                </div>
                <button type="button" class="btn-change-photo">
                    📷 Cambiar foto
                </button>
            </div>

            <!-- Campos del formulario -->
            <div class="form-group">
                <label for="username">Nombre</label>
                <input type="text" id="username" name="username" value="ian peralta" required>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" value="ian08.mp@gmail.com" required>
            </div>

            <div class="form-group">
                <label for="edad">Edad</label>
                <input type="text" id="edad" name="edad" value="18 años">
            </div>

            <!-- Botón inferior grande opcional (como referencia adicional) -->
            <button type="submit" class="btn-submit-large">Actualizar información</button>
        </form>
    </main>
</body>
</html>
