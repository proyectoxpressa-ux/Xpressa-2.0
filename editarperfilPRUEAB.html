<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xpressa+ | Editar Perfil</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Nunito:wght@700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Nunito', sans-serif; }
        body { background-color: #E0F2FE; display: flex; flex-direction: column; align-items: center; padding: 20px 15px 50px; }

        .top-bar { width: 100%; max-width: 480px; margin-bottom: 20px; }
        .btn-volver {
            text-decoration: none; color: #3B82F6; font-family: 'Fredoka', sans-serif; font-size: 1.2rem;
            background: #FFFFFF; padding: 12px 20px; border-radius: 20px; display: inline-block;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05); border: 3px solid #FFF;
        }

        .tarjeta-perfil {
            background-color: #FFFFFF; width: 100%; max-width: 450px; border-radius: 35px;
            padding: 35px 25px; box-shadow: 0 15px 35px rgba(59, 130, 246, 0.15); text-align: center;
            border: 4px solid #FFF;
        }
        .titulo-perfil { font-family: 'Fredoka', sans-serif; color: #1E293B; font-size: 2rem; margin-bottom: 25px; }

        .circulo-foto {
            width: 130px; height: 130px; background-color: #EFF6FF; border: 6px solid #3B82F6;
            border-radius: 50%; margin: 0 auto 15px; display: flex; align-items: center; justify-content: center;
            font-size: 70px; box-shadow: 0 8px 20px rgba(59, 130, 246, 0.3);
        }
        .btn-cambiar-foto {
            background-color: #93C5FD; color: #1E3A8A; border: none; padding: 10px 20px;
            border-radius: 20px; font-weight: 800; font-size: 1rem; cursor: pointer; margin-bottom: 30px;
        }

        .grupo-input { text-align: left; margin-bottom: 20px; }
        .grupo-input label { display: block; font-size: 1.1rem; color: #64748B; font-weight: 800; margin-bottom: 8px; margin-left: 5px;}
        .grupo-input input {
            width: 100%; padding: 16px 20px; border: 3px solid #E2E8F0; border-radius: 22px;
            background-color: #F8FAFC; font-size: 1.1rem; color: #1E293B; font-weight: 700; transition: all 0.3s;
        }
        .grupo-input input:focus { background-color: #FFFFFF; border-color: #3B82F6; outline: none; transform: scale(1.02); }

        .btn-guardar {
            width: 100%; background-color: #F59E0B; color: white; border: none; padding: 18px;
            font-family: 'Fredoka', sans-serif; font-size: 1.4rem; border-radius: 25px; margin-top: 10px;
            box-shadow: 0 8px 0 #D97706; cursor: pointer; transition: all 0.1s;
        }
        .btn-guardar:active { transform: translateY(8px); box-shadow: 0 0 0 #D97706; }
    </style>
</head>
<body>
    <div class="top-bar">
        <a href="perfil.html" class="btn-volver">← Volver</a> 
    </div>
    <div class="tarjeta-perfil">
        <h1 class="titulo-perfil">Tus Datos</h1>
        <div class="contenedor-avatar">
            <div class="circulo-foto">🧒🏽</div>
            <button class="btn-cambiar-foto">Cambiar foto 📸</button>
        </div>
        <div class="grupo-input"><label>Nombre</label><input type="text" placeholder="Ej: Ian" id="input-nombre"></div>
        <div class="grupo-input"><label>Apellido</label><input type="text" placeholder="Ej: Pérez" id="input-apellido"></div>
        <div class="grupo-input"><label>DNI</label><input type="text" placeholder="Ej: 12345678" id="input-dni"></div>
        <div class="grupo-input"><label>Edad</label><input type="text" placeholder="Ej: 8" id="input-edad"></div>
        <div class="grupo-input"><label>Sexo</label><input type="text" placeholder="¿Cuál es tu género?" id="input-sexo"></div>
        <button class="btn-guardar" id="btn-guardar-perfil">¡Guardar! 💾</button>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            const usuario_id = localStorage.getItem('usuario_id');
            const nombreGuardado = localStorage.getItem('nombre_usuario');
            if (!usuario_id) { window.location.href = 'sesion.html'; return; }
            try {
                const respuesta = await fetch(`http://localhost:3000/api/perfil/${usuario_id}`);
                if (respuesta.ok) {
                    const datos = await respuesta.json();
                    document.getElementById('input-nombre').value = datos.nombre || nombreGuardado || '';
                    document.getElementById('input-apellido').value = datos.apellido || '';
                    document.getElementById('input-dni').value = datos.dni || '';
                    document.getElementById('input-edad').value = datos.edad || '';
                    document.getElementById('input-sexo').value = datos.sexo || '';
                } else { document.getElementById('input-nombre').value = nombreGuardado || ''; }
            } catch (error) { document.getElementById('input-nombre').value = nombreGuardado || ''; }
        });

        document.getElementById('btn-guardar-perfil').addEventListener('click', async function() {
            const usuario_id = localStorage.getItem('usuario_id');
            if (!usuario_id) { window.location.href = 'sesion.html'; return; }
            const nombre = document.getElementById('input-nombre').value;
            const apellido = document.getElementById('input-apellido').value;
            const dni = document.getElementById('input-dni').value;
            const edad = document.getElementById('input-edad').value;
            const sexo = document.getElementById('input-sexo').value;
            try {
                const response = await fetch('http://localhost:3000/api/perfil', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ usuario_id, nombre, apellido, dni, edad, sexo })
                });
                const data = await response.json();
                if (response.ok) { alert('¡Datos guardados con éxito!'); window.location.href = 'perfil.html'; } 
                else { alert('Error: ' + data.mensaje); }
            } catch (error) { alert('No se pudo guardar el perfil.'); }
        });
    </script>
</body>
</html>
