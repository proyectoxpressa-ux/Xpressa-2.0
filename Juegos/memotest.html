<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xpressa+ | Memotest</title>

    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box; /*Para que los bordes no deformen las cartas*/
            font-family: 'Nunito', sans-serif;
        }
        
        body {
            background-color: #F0F8FF; 
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh; /* Para que ocupe toda la altura de la ventana */
        }

        .top-bar {
            width : 100%;
            max-width: 480px; /* Maximo ancho para que no se deforme en ninguna pantalla */
            display: flex;
            align-items: center;
            justify-content: flex-start;
            margin-bottom: 10px;
        }

        .btn-volver {
            text-decoration: none; /*Elimina el subrayado*/
            color: #4A90E2; /* Color azul de la marca */
            font-weight: 800;
            font-size: 15px; 
            display: inline-flex; /* Para que el icono y el texto estén en línea */
            align-items: center;
            gap: 6px; /* Espacio entre el icono y el texto */
            background: #FFFFFF;
            padding: 6px 14px;
            border-radius: 20px;
            box-shadow: 0 2px 8px rgba(75, 145, 225, 0.1); /* Sombra */
        }

        .header-juego {
            text-align: center;
            margin-bottom: 20px;
        }

        .titulo-juego {
            color: #2C3E50;
            font-size: 28px;
            font-weight: 900;
            margin-bottom: 4px;
        }

        .subtitulo-juego {
            font-size: 15px;
            font-weight: 700;
            color:#64748B
        }
        
        /* 6 cartas, 3columnas x 2 filas */
        .contmemo {
            display: grid;
            grid-template-columns: repeat(3, 1fr); /* 3 columnas iguales */
            gap: 15px; /* Espacio entre cada carta */
            max-width: 480px; /* Tamaño máximo para que no se deforme */
            width: 100%;
        }

        .carta {
            width: 100%;
            height: 150px; /* Altura fija para todas las cartas */
            perspective: 900px; /* Para el efecto 3D */
            cursor: pointer; /* Cambia el cursor al pasar sobre la carta */
            user-select: none; /* Evita seleccionar texto sin querer */
        }

        .carta-inner {
            position: relative;
            width: 100%;
            height: 100%;
            border-radius: 20px;
            transform-style: preserve-3d; /* Necesario para el efecto 3D */
            transition: transform 0.4s; /* Suaviza la animación de giro */
            box-shadow: 0 6px 14px rgba(74, 144, 226, 0.15); /* Sombra para dar profundidad */
        }

        .carta:hover {
            transform: scale(0.96); /* Efecto de zoom al pasar el mouse */
        }

        .trasera, .delantera {
            position: absolute;
            inset: 0; /* Ocupa todo el espacio del contenedor */
            border-radius: 20px;
            backface-visibility: hidden; /* Oculta la cara trasera cuando se gira */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .trasera {
            background-color: #5c9ce6;
            border: 3px solid #ffffff;
        }

        .trasera p {
            font-size: 40px;
            font-weight: 900;
            color: #ffffff; /* Color blanco para el signo de interrogación */
        }

        .delantera {
            background-color: #ffffff;
            border: 3px solid #99C5F7;
            transform: rotateY(180deg); /* Gira la cara delantera para que esté oculta inicialmente */
            padding: 8px 6px;
            justify-content: space-between; /* Distribuye el contenido de la carta */
        }

        .delantera img {
            width: 90px;
            height: 90px;
            object-fit: contain; /* Para que la imagen no se deforme */
            margin-bottom: 5px; 
        }

        .delantera p {
            font-size: 20px;
            font-weight: 800;
            color: #2C3E50;
            text-align: center;
            margin-bottom: 5px;
        }

        

    </style>
</head>
