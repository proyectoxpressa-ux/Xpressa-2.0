<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Lobby del Memotest</title>
    <style>
         .top-bar {
            width : 100%;
            max-width: 480px; /* Maximo ancho para que no se deforme en ninguna pantalla */
            display: flex;
            align-items: center;
            justify-content: flex-start;
            margin-bottom: 10px;
        }

        .btn-volver {
            text-decoration: none; /*Elimina el subrayado*/
            color: #4A90E2; /* Color azul de la marca */
            font-weight: 800;
            font-size: 15px; 
            display: inline-flex; /* Para que el icono y el texto estén en línea */
            align-items: center;
            gap: 6px; /* Espacio entre el icono y el texto */
            background: #FFFFFF;
            padding: 6px 14px;
            border-radius: 20px;
            box-shadow: 0 2px 8px rgba(75, 145, 225, 0.1); /* Sombra */
        }
        /* Un poco de estilo básico para que parezca un juego */
        body { font-family: 'Comic Sans MS', sans-serif; text-align: center; background-color: #f0f8ff; }
        .opcion { padding: 15px 30px; margin: 10px; font-size: 20px; cursor: pointer; border-radius: 10px; border: 2px solid #ccc; background: white; }
        .seleccionado { background-color: #ffeb3b; border-color: #ff9800; font-weight: bold; }
        #btn-jugar { padding: 20px 50px; font-size: 24px; background-color: #4caf50; color: white; border: none; border-radius: 15px; cursor: pointer; margin-top: 30px; box-shadow: 0px 5px 0px #388e3c; }
        #btn-jugar:active { transform: translateY(5px); box-shadow: none; } /* Efecto de presionar el botón */
    </style>
</head>
<body>
     <div class="top-bar">
        <a href="../juegos.html" class="btn-volver">← Volver</a> <!-- ../ PARA SALIR DE LA CARPETA DE ARCHIVOS -->
    </div>

    <h1>¡Preparando el Memotest! 🃏</h1>

    <h3>1. ¿Qué sonido practicamos?</h3>
    <!-- Pasamos el valor 'R' o 'S' a la función de JavaScript cuando hacen clic -->
    <button id="sonido r" class="opcion" onclick="seleccionarSonido('R')"> R-RR 🐶</button>
    <button id="sonido tr" class="opcion" onclick="seleccionarSonido('TR')">TR 🚂</button>
    <button id="sonido pr" class="opcion" onclick="seleccionarSonido('PR')">PR 🤴🏻</button></br>
    <button id="sonido dr" class="opcion" onclick="seleccionarSonido('DR')">DR 🐲</button>
    <button id="sonido pl" class="opcion" onclick="seleccionarSonido('PL')">PL 🪶</button>
    <button id="sonido c" class="opcion" onclick="seleccionarSonido('C')">C 🐌</button>

    <br>
    
    <!-- Este es el botón gigante que dispara el viaje al otro archivo -->
    <button id="btn-jugar" onclick="irAlJuego()">¡A JUGAR! 🚀</button>

    <script>
        // Variables para guardar lo que elige el niño temporalmente
        let sonidoElegido = "";

        // Función para elegir la letra y pintar el botón
        function seleccionarSonido(sonido) {
            sonidoElegido = sonido;
            // Limpiamos colores y pintamos solo el elegido (detalles visuales)
            document.getElementById('sonido r').classList.remove('seleccionado');
            document.getElementById('sonido tr').classList.remove('seleccionado');
            document.getElementById('sonido pr').classList.remove('seleccionado');
            document.getElementById('sonido dr').classList.remove('seleccionado');
            document.getElementById('sonido pl').classList.remove('seleccionado');
            document.getElementById('sonido c').classList.remove('seleccionado');
            document.getElementById('sonido ' + sonido.toLowerCase()).classList.add('seleccionado');
        }

        // ¡LA FUNCIÓN MÁS IMPORTANTE! Se ejecuta al tocar "A JUGAR"
        function irAlJuego() {
            // 1. Verificamos que el niño haya elegido ambas cosas
            if (sonidoElegido === "") {
                alert("¡Falta elegir el sonido!");
                return; // Cortamos la función acá para que no avance
            }

            // 2. Guardamos los datos en la memoria del navegador (localStorage)
            localStorage.setItem("letraMemotest", sonidoElegido);

            // 3. Lo mandamos volando al archivo del juego
            window.location.href = "memotest.html"; 
        }
    </script>
</body>
</html>
