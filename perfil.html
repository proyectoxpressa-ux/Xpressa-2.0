<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xpressa+ | Perfil</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Nunito', sans-serif; -webkit-tap-highlight-color: transparent;}
        
        body { 
            background: linear-gradient(135deg, #a3ceef 0%, #e0f2fe 100%);
            background-attachment: fixed;
            color: #1E293B; 
            display: flex; flex-direction: column; min-height: 100vh; 
            padding-bottom: 120px; 
            position: relative;
            overflow-x: hidden;
        }

        /* --- BURBUJAS DE FONDO --- */
        .burbuja {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.4);
            filter: blur(2px);
            z-index: -1;
        }
        .burbuja-1 { width: 150px; height: 150px; top: -20px; right: -30px; }
        .burbuja-2 { width: 200px; height: 200px; top: 40%; left: -80px; }
        .burbuja-3 { width: 100px; height: 100px; bottom: 10%; right: 20px; }

        /* --- ENCABEZADO SUPERIOR --- */
        .header-top {
            display: flex; justify-content: space-between; align-items: center; 
            padding: 20px 25px; background: transparent;
        }
        .logo-container { display: flex; align-items: center; gap: 12px; }
        .logo-img { 
            width: 45px; height: 45px; border-radius: 12px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.1); 
            background: white; padding: 2px;
        }
        .logo-text { font-family: 'Fredoka', sans-serif; font-size: 1.5rem; font-weight: 700; color: #1E3A8A; }

        main { 
            padding: 10px 25px 25px; max-width: 600px; margin: 0 auto; width: 100%; 
            display: flex; flex-direction: column; gap: 20px;
        }

        .titulo-seccion {
            font-family: 'Fredoka', sans-serif; 
            font-size: 40px; 
            color: #1E3A8A; 
            line-height: 1.1;
            margin-bottom: 4px;
            text-align: center;
        }

        .subtitulo {
            font-size: 20px;
            color: #3B82F6;
            font-weight: 800;
            margin-bottom: 15px;
            text-align: center;
        }

        .menu-card {
            background-color: #FFFFFF; padding: 22px 25px; border-radius: 30px;
            box-shadow: 0 12px 25px rgba(59, 130, 246, 0.15); width: 100%; display: flex;
            align-items: center; justify-content: space-between; text-decoration: none;
            border: 4px solid #FFFFFF; transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .menu-card:hover { transform: translateY(-5px); border-color: #60A5FA; box-shadow: 0 15px 35px rgba(59, 130, 246, 0.25); }
        .menu-card:active { transform: scale(0.95); }
        
        .menu-left { display: flex; align-items: center; gap: 20px; }
        .menu-icon-box {
            width: 65px; height: 65px; border-radius: 20px; background-color: #EFF6FF;
            display: flex; align-items: center; justify-content: center; font-size: 35px;
            box-shadow: inset 0 -4px 0 rgba(0,0,0,0.05);
        }
        .menu-text { display: flex; flex-direction: column; gap: 2px;}
        .menu-title { font-family: 'Fredoka', sans-serif; font-size: 1.3rem; color: #1E293B; }
        .menu-subtitle { font-size: 0.85rem; font-weight: 800; color: #64748B; }
        .menu-arrow { font-size: 2rem; color: #3B82F6; font-weight: 800; }

        /* --- BARRA INFERIOR (Estilo Burbuja) --- */
        .bottom-nav {
            position: fixed; 
            bottom: 15px; 
            left: 50%; 
            transform: translateX(-50%);
            width: 90%; 
            max-width: 400px; 
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            display: flex; 
            justify-content: space-around; 
            padding: 10px;
            border-radius: 35px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            z-index: 10; 
            border: 3px solid #FFF;
        }

        .nav-item { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            gap: 3px; 
            text-decoration: none; 
            color: #94A3B8; 
            font-weight: 800; 
            font-size: 0.8rem; 
            transition: all 0.3s; 
        }

        .nav-icon { 
            font-size: 1.5rem; 
            transition: transform 0.3s; 
        }

        .nav-item.active { 
            color: #3B82F6; 
        }
        
        .nav-item.active .nav-icon { 
            transform: scale(1.2) translateY(-2px); 
        }

        /* Responsive para pantallas extremadamente pequeñas */
        @media (max-width: 360px) {
            .grilla-juegos { grid-template-columns: 1fr; } /* Todo en 1 columna si es muy chiquito */
            .card-destacada { grid-column: span 1; flex-direction: column !important; text-align: center !important; }
            .card-destacada .juego-textos { align-items: center !important; margin-left: 0; }
        }
    </style>
</head>
<body>
    <div class="burbuja burbuja-1"></div>
    <div class="burbuja burbuja-2"></div>
    <div class="burbuja burbuja-3"></div>

    <header class="header-top">
        <div class="logo-container">
            <img src="imagenes/logo.png" alt="Xpressa+" class="logo-img" onerror="this.src='https://via.placeholder.com/45/FFF/3B82F6?text=X'">
            <span class="logo-text">Xpressa+</span>
        </div>
    </header>

    <main>
        <div>
            <h2 class="titulo-seccion">Mi Mochila 🎒</h2>
            <p class="subtitulo">Configura tu cuenta y sonidos</p>
        </div>

        <a href="editarperfil.html" class="menu-card">
            <div class="menu-left">
                <div class="menu-icon-box">✏️</div>
                <div class="menu-text">
                    <span class="menu-title">Mis Datos</span>
                    <span class="menu-subtitle">Cambia tu nombre o foto</span>
                </div>
            </div>
            <span class="menu-arrow">›</span>
        </a>
        <a href="elegirletraoficial.html" class="menu-card">
            <div class="menu-left">
                <div class="menu-icon-box">🔤</div>
                <div class="menu-text">
                    <span class="menu-title">Mis Letras</span>
                    <span class="menu-subtitle">Elige nuevos sonidos</span>
                </div>
            </div>
            <span class="menu-arrow">›</span>
        </a>
    </main>

    <nav class="bottom-nav">
        <a href="home.html" class="nav-item"><span class="nav-icon">🏠</span>Inicio</a>
        <a href="juegos.html" class="nav-item"><span class="nav-icon">🎮</span>Juegos</a>
        <a href="perfil.html" class="nav-item active"><span class="nav-icon">⚙️</span>Perfil</a>
    </nav>
</body>
</html>
