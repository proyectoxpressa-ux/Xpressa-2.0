<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xpressa+ | Elegir Superpoderes</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Nunito:wght@700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Nunito', sans-serif; -webkit-tap-highlight-color: transparent;}
        
        body {
            background: linear-gradient(180deg, #7DD3FC 0%, #E0F2FE 100%);
            background-attachment: fixed;
            animation: fondoMagico 10s ease infinite;
            display: flex; flex-direction: column; align-items: center;
            justify-content: center; min-height: 100vh; padding: 20px;
            font-family: 'Nunito', sans-serif;
        }

        /* --- BURBUJAS DE FONDO (Para llenar los vacíos) --- */
        .burbuja {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.4);
            filter: blur(2px);
            z-index: -1;
        }
        .burbuja-1 { width: 150px; height: 150px; top: -20px; right: -30px; }
        .burbuja-2 { width: 200px; height: 200px; top: 40%; left: -80px; }
        .burbuja-3 { width: 100px; height: 100px; bottom: 10%; right: 20px; }
        
        .contenedor-principal { width: 100%; max-width: 500px; padding: 20px; padding-bottom: 140px; }
        
        .tarjeta-mensaje {
            background-color: #FFFFFF; border: 4px solid #bae6fd; border-radius: 25px;
            padding: 20px; display: flex; align-items: center; 
            box-shadow: 0 10px 25px rgba(56, 189, 248, 0.2); margin-bottom: 30px;
        }
        .avatar-xpri { font-size: 50px; margin-right: 15px; animation: rebote 2s infinite; }
        @keyframes rebote { 0%, 100%{transform: translateY(0);} 50%{transform: translateY(-10px);} }

        .tarjeta-mensaje p { font-family: 'Fredoka', sans-serif; font-size: 1.3rem; color: #0284c7; line-height: 1.2; }

        .grilla-animales { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
        .envoltorio-tarjeta input[type="checkbox"] { display: none; }

        .tarjeta-animal {
            background-color: #FFFFFF; border: 4px solid #e2e8f0; border-radius: 30px;
            padding: 25px 10px; text-align: center; position: relative; 
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            min-height: 160px; box-shadow: 0 8px 15px rgba(0,0,0,0.05); transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
        }
        .emoji-animal { font-size: 60px; margin-bottom: 5px; transition: transform 0.2s;}
        .texto-letras { font-family: 'Fredoka', sans-serif; font-size: 26px; color: #94a3b8; transition: color 0.2s; }
        .tilde-ok {
            position: absolute; top: -10px; right: -10px; width: 40px; height: 40px; border-radius: 50%;
            background-color: #10B981; color: white; font-size: 24px; font-weight: bold;
            display: flex; align-items: center; justify-content: center; border: 4px solid white;
            opacity: 0; transform: scale(0); transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .envoltorio-tarjeta input[type="checkbox"]:checked + .tarjeta-animal {
            border-color: #3B82F6; background-color: #eff6ff;
            transform: scale(1.05) translateY(-5px); box-shadow: 0 15px 25px rgba(59, 130, 246, 0.3);
        }
        .envoltorio-tarjeta input[type="checkbox"]:checked + .tarjeta-animal .texto-letras { color: #3B82F6; }
        .envoltorio-tarjeta input[type="checkbox"]:checked + .tarjeta-animal .emoji-animal { transform: scale(1.2); }
        .envoltorio-tarjeta input[type="checkbox"]:checked + .tarjeta-animal .tilde-ok { opacity: 1; transform: scale(1); }

        .barra-mochila {
            position: fixed; bottom: 0; left: 0; right: 0; display: flex; justify-content: center;
            padding: 20px; background: linear-gradient(to top, #E0F2FE 80%, transparent); pointer-events: none;
        }
        .caja-mochila {
            width: 100%; max-width: 460px; background-color: #FFFFFF; border-radius: 35px;
            padding: 15px 25px; display: flex; align-items: center; justify-content: space-between;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15); border: 4px solid #3B82F6; pointer-events: auto;
        }
        .info-mochila { font-family: 'Fredoka', sans-serif; font-size: 1.3rem; color: #1E293B; display: flex; align-items: center; gap: 10px;}
        .numero-destacado { color: #F59E0B; font-size: 2rem; background: #fffbeb; padding: 5px 15px; border-radius: 20px; }
        
        .btn-jugar {
            background-color: #cbd5e1; color: white; border: none; padding: 18px 30px;
            font-family: 'Fredoka', sans-serif; font-size: 1.4rem; border-radius: 25px;
            transition: all 0.2s; pointer-events: none;
        }
        .btn-jugar.activado {
            background-color: #10B981; cursor: pointer; pointer-events: auto;
            box-shadow: 0 8px 0 #059669; transform: translateY(-5px);
        }
        .btn-jugar.activado:active { transform: translateY(3px); box-shadow: 0 0 0 #059669; }
    </style>

</head>
<body>
    <div class="burbuja burbuja-1"></div>
    <div class="burbuja burbuja-2"></div>
    <div class="burbuja burbuja-3"></div>

    <div class="contenedor-principal">
        <div class="tarjeta-mensaje">
        <div class="avatar-xpri">🐣</div>
        <p>Toca los animales y descubre con qué letras vamos a jugar hoy.</p>
    </div>

    <div class="grilla-animales">
      <label class="envoltorio-tarjeta"><input type="checkbox" class="checkbox-letra" value="R-RR"><div class="tarjeta-animal"><div class="tilde-ok">✓</div><div class="emoji-animal">🐭</div><p class="texto-letras">R · RR</p></div></label>
      <label class="envoltorio-tarjeta"><input type="checkbox" class="checkbox-letra" value="TR"><div class="tarjeta-animal"><div class="tilde-ok">✓</div><div class="emoji-animal">🚂</div><p class="texto-letras">TR</p></div></label>
      <label class="envoltorio-tarjeta"><input type="checkbox" class="checkbox-letra" value="PR"><div class="tarjeta-animal"><div class="tilde-ok">✓</div><div class="emoji-animal">🤴🏻</div><p class="texto-letras">PR</p></div></label>
      <label class="envoltorio-tarjeta"><input type="checkbox" class="checkbox-letra" value="DR"><div class="tarjeta-animal"><div class="tilde-ok">✓</div><div class="emoji-animal">🐲</div><p class="texto-letras">DR</p></div></label>
      <label class="envoltorio-tarjeta"><input type="checkbox" class="checkbox-letra" value="PL"><div class="tarjeta-animal"><div class="tilde-ok">✓</div><div class="emoji-animal">🪶</div><p class="texto-letras">PL</p></div></label>
      <label class="envoltorio-tarjeta"><input type="checkbox" class="checkbox-letra" value="C"><div class="tarjeta-animal"><div class="tilde-ok">✓</div><div class="emoji-animal">🐌</div><p class="texto-letras">C</p></div></label>
    </div>
  </div>

  <div class="barra-mochila">
    <div class="caja-mochila">
      <div class="info-mochila"><span style="font-size: 35px;">🎒</span> <span id="cantidad-mochila" class="numero-destacado">0</span></div>
      <button id="boton-avanzar" class="btn-jugar">¡Listo!</button>
    </div>
  </div>

  <script>
    const checkboxesDeLetras = document.querySelectorAll('.checkbox-letra');
    const textoCantidadMochila = document.getElementById('cantidad-mochila');
    const botonAvanzar = document.getElementById('boton-avanzar');

    function revisarMochila() {
        let letrasElegidas = 0;
        checkboxesDeLetras.forEach(checkbox => { if (checkbox.checked) letrasElegidas++; });
        textoCantidadMochila.textContent = letrasElegidas;
        if (letrasElegidas > 0) { botonAvanzar.classList.add('activado'); } 
        else { botonAvanzar.classList.remove('activado'); }
    }
    checkboxesDeLetras.forEach(checkbox => checkbox.addEventListener('change', revisarMochila));

    botonAvanzar.addEventListener('click', async function() {
        if (!this.classList.contains('activado')) return;
        const usuario_id = localStorage.getItem('usuario_id');
        if (!usuario_id) { alert("Error: No se encontró la sesión del usuario."); return; }
        let letrasSeleccionadas = [];
        checkboxesDeLetras.forEach(checkbox => { if (checkbox.checked) letrasSeleccionadas.push(checkbox.value); });
        try {
            const respuesta = await fetch('http://localhost:3000/api/guardar-letras', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ usuario_id: usuario_id, letras: letrasSeleccionadas })
            });
            if (respuesta.ok) window.location.href = 'home.html';
            else alert('Error al guardar las letras.');
        } catch (error) { console.error('Error:', error); alert('No se pudo conectar con el servidor.'); }
    });
  </script>
</body>
</html>
