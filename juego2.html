<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xpressa+ | Juegos</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="stylehome.css">
    <style>
        .games-container {
            width: 100%;
            max-width: 540px;
            margin: 0 auto;
            padding: 1.5rem 1rem;
            display: flex;
            flex-direction: column;
            gap: 1.1rem;
        }

        .section-headline {
            font-family: 'Fredoka', sans-serif;
            font-size: 1.35rem;
            color: #2A4365;
            margin-bottom: 0.1rem;
        }

        .game-card-link {
            background-color: var(--card-bg);
            border-radius: 20px;
            padding: 1.1rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            text-decoration: none;
            color: var(--text-dark);
            border: 2px solid #DCEAFD;
            box-shadow: 0 4px 14px rgba(74, 144, 226, 0.1);
            transition: all 0.2s ease;
        }

        .game-card-link:hover {
            transform: translateY(-2px);
            border-color: var(--primary-blue);
            box-shadow: 0 8px 20px rgba(74, 144, 226, 0.16);
        }

        .game-left {
            display: flex;
            align-items: center;
            gap: 1.1rem;
        }

        .game-thumb {
            width: 58px; height: 58px;
            border-radius: 16px;
            background: linear-gradient(135deg, #EBF4FF 0%, #D5E8FF 100%);
            display: flex; align-items: center; justify-content: center;
            font-size: 2.2rem;
            border: 1px solid #BFDCFF;
        }

        .game-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .game-name {
            font-family: 'Fredoka', sans-serif;
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--primary-blue);
        }

        .game-desc {
            font-size: 0.85rem;
            font-weight: 600;
            color: #64748B;
        }

        .btn-play-tag {
            background-color: var(--primary-blue);
            color: white;
            font-family: 'Fredoka', sans-serif;
            font-size: 0.9rem;
            font-weight: 600;
            padding: 8px 16px;
            border-radius: 12px;
            box-shadow: 0 3px 8px rgba(74, 144, 226, 0.25);
        }
    </style>
</head>
<body>
    <header class="header-top">
        <div class="logo-container">
            <img src="logo.png" alt="Xpressa+" class="logo-img">
            <h1 class="logo-text">Xpressa+</h1>
        </div>
        <div class="header-title-center"> 
            <span>Juegos</span>
        </div>
    </header>

    <main class="games-container">
        <h2 class="section-headline">Elegí tu actividad 🎯</h2>

        <!-- Juego 1 -->
        <a href="viaje-letras.html" class="game-card-link">
            <div class="game-left">
                <div class="game-thumb">🚂</div>
                <div class="game-info">
                    <span class="game-name">Viaje de letras</span>
                    <span class="game-desc">Ubica los sonidos en el vagón</span>
                </div>
            </div>
            <span class="btn-play-tag">Jugar</span>
        </a>

        <!-- Juego 2 -->
        <a href="memotest.html" class="game-card-link">
            <div class="game-left">
                <div class="game-thumb">🃏</div>
                <div class="game-info">
                    <span class="game-name">Memotest</span>
                    <span class="game-desc">Encuentra las parejas de fonemas</span>
                </div>
            </div>
            <span class="btn-play-tag">Jugar</span>
        </a>

        <!-- Juego 3 -->
        <a href="semaforo-palabras.html" class="game-card-link">
            <div class="game-left">
                <div class="game-thumb">🚦</div>
                <div class="game-info">
                    <span class="game-name">Semáforo de palabras</span>
                    <span class="game-desc">Identifica si contiene el fonema</span>
                </div>
            </div>
            <span class="btn-play-tag">Jugar</span>
        </a>
    </main>
  
    <nav class="bottom-nav">
        <a href="Home.html" class="nav-item">
            <span class="nav-icon">🏠</span>
            <span class="nav-label">Inicio</span>
        </a>
        <a href="Juego.html" class="nav-item active">
            <span class="nav-icon">🎮</span>
            <span class="nav-label">Juegos</span>
        </a>
        <a href="Perfil.html" class="nav-item">
            <span class="nav-icon">🔩</span>
            <span class="nav-label">Mi Perfil</span>
        </a>
    </nav>
</body>
</html>
