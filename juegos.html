<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xpressa+ | Juegos</title>
    
    <!-- Fuentes de Google -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
    
    
    <style>
        /* =========================================
           1. ESTILOS BASE GENERALES
           ========================================= */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Nunito', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --bg-color: #F0F8FF;
            --primary-blue: #4A90E2;
            --light-blue: #5C9CE6;
            --card-bg: #FFFFFF;
            --text-dark: #333333;
            --shadow: 0 8px 16px rgba(74, 144, 226, 0.15);
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-dark);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            padding-bottom: 90px;
        }

        /* =========================================
           2. ENCABEZADO SUPERIOR (Header)
           ========================================= */
        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 1.5rem;
            background-color: var(--primary-blue);
            color: white;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            border-bottom-left-radius: 20px;
            border-bottom-right-radius: 20px;
            position: relative;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-img {
            width: 35px;
            height: auto;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2));
            border-radius: 7px;
        }

        .logo-text {
            font-size: 1.2rem;
            font-weight: 800;
        }

        .header-title-center {
            display: flex;
            align-items: center;
            position: absolute; 
            left: 50%;          
            transform: translateX(-50%); 
            font-weight: 750;   
            font-size: 1.2rem;
        }

        /* =========================================
           3. CONTENEDOR DE TODOS LOS JUEGOS
           ========================================= */
        .cont-juegos {
            width: 100%;
            max-width: 540px;
            margin: 0 auto;
            padding: 24px 16px;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .elegiractividad {
            font-family: 'Fredoka', sans-serif;
            font-size: 22px;
            color: #2A4365;
            margin-bottom: 2px;
        }

        /* =========================================
           4. TARJETAS DE LOS JUEGOS
           ========================================= */
        .game-card-link {
            background-color: #FFFFFF;
            border-radius: 20px;
            padding: 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            text-decoration: none;
            color: #333333;
            border: 2px solid #DCEAFD;
            box-shadow: 0 4px 14px rgba(74, 144, 226, 0.1);
            transition: all 0.2s ease; 
        }

        .game-card-link:hover {
            transform: translateY(-2px); 
            border-color: #4A90E2;
            box-shadow: 0 8px 20px rgba(74, 144, 226, 0.16);
        }

        .game-left {
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .emoji-juego {
            width: 58px;
            height: 58px;
            border-radius: 16px;
            background: linear-gradient(135deg, #EBF4FF 0%, #D5E8FF 100%);
            display: flex; 
            align-items: center; 
            justify-content: center;
            font-size: 35px;
            border: 1px solid #BFDCFF;
        }

        .juego-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .nombre-juego {
            font-family: 'Fredoka', sans-serif;
            font-size: 19px;
            font-weight: 700;
            color: #4A90E2;
        }

        .game-desc {
            font-size: 14px;
            font-weight: 600;
            color: #64748B;
        }

        .btn-playjugar {
            background-color: #4A90E2;
            color: white;
            font-family: 'Fredoka', sans-serif;
            font-size: 14px;
            font-weight: 600;
            padding: 8px 16px;
            border-radius: 12px;
            box-shadow: 0 3px 8px rgba(74, 144, 226, 0.25);
        }

        /* =========================================
           5. BARRA INFERIOR DE NAVEGACIÓN (Footer)
           ========================================= */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: var(--primary-blue);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 1rem 0 1.5rem 0;
            box-shadow: 0 -4px 15px rgba(0,0,0,0.05);
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            z-index: 10;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: #A0B4C8;
            flex: 1;
            transition: color 0.3s ease, transform 0.3s ease;
        }

        .nav-icon {
            font-size: 1.8rem;
            margin-bottom: 4px;
        }

        .nav-label {
            font-size: 0.8rem;
            font-weight: 700;
        }

        .nav-item.active {
            color: #FFFFFF;
            transform: translateY(-3px);
        }

        .nav-item.active .nav-icon {
            filter: drop-shadow(0 4px 6px rgba(74, 144, 226, 0.4));
        }
    </style>
</head>
<body>
    
    <!-- ENCABEZADO -->
    <header class="header-top">
        <div class="logo-container">
            <img src="imagenes/logo.png" alt="Xpressa+" class="logo-img">
            <h1 class="logo-text">Xpressa+</h1>
        </div>
        <div class="header-title-center"> 
            <span>Juegos</span>
        </div>
    </header>

    <!-- CONTENEDOR PRINCIPAL DE LOS JUEGOS -->
    <main class="cont-juegos">
        
        <h2 class="elegiractividad">Elegí tu actividad 🎯</h2>

        <!-- Juego 1: Viaje de letras -->
        <a href="Juegos/viajemuestra.html" class="game-card-link">
            <div class="game-left">
                <div class="emoji-juego">🚂</div>
                <div class="juego-info">
                    <span class="nombre-juego">Viaje de letras</span>
                    <span class="game-desc">Ubica los sonidos en el vagón</span>
                </div>
            </div>
            <span class="btn-playjugar">Jugar</span>
        </a>

        <!-- Juego 2: Memotest -->
        <a href="Juegos/memotest.html" class="game-card-link">
            <div class="game-left">
                <div class="emoji-juego">🃏</div>
                <div class="juego-info">
                    <span class="nombre-juego">Memotest</span>
                    <span class="game-desc">Encuentra las parejas de fonemas</span>
                </div>
            </div>
            <span class="btn-playjugar">Jugar</span>
        </a>

        <!-- Juego 3: Semáforo de palabras -->
        <a href="Juegos/semaforomuestra.html" class="game-card-link">
            <div class="game-left">
                <div class="emoji-juego">🚦</div>
                <div class="juego-info">
                    <span class="nombre-juego">Semáforo de palabras</span>
                    <span class="game-desc">Identifica si contiene el fonema</span>
                </div>
            </div>
            <span class="btn-playjugar">Jugar</span>
        </a>
        
    </main>
  
    <!-- BARRA INFERIOR -->
    <nav class="bottom-nav">
        <a href="home.html" class="nav-item">
            <span class="nav-icon">🏠</span>
            <span class="nav-label">Inicio</span>
        </a>
        <a href="juegos.html" class="nav-item active">
            <span class="nav-icon">🎮</span>
            <span class="nav-label">Juegos</span>
        </a>
        <a href="perfil.html" class="nav-item">
            <span class="nav-icon">🔩</span>
            <span class="nav-label">Mi Perfil</span>
        </a>
    </nav>

</body>
</html>
