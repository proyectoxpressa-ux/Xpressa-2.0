<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xpressa+ | Cargando...</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background: linear-gradient(135deg, #a3ceef 0%, #e0f2fe 100%);
            height: 100vh; display: flex; flex-direction: column;
            align-items: center; justify-content: center; overflow: hidden;
        }

        .splash-logo { 
            width: 100px; height: 100px; border-radius: 25px; background: white;
            box-shadow: 0 10px 25px rgba(59, 130, 246, 0.3); margin-bottom: 20px; padding: 2px;
            animation: latido 1.5s infinite ease-in-out;
        }

        .splash-title { 
            color: #3B82F6; font-family: 'Fredoka', sans-serif; font-size: 3rem; 
            font-weight: 700; text-shadow: 2px 2px 0px #FFF; 
        }
        
        @keyframes latido {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <!-- Animación de Carga -->
    <img src="imagenes/logo.png" alt="Xpressa+" class="splash-logo" onerror="this.src='https://via.placeholder.com/100/FFF/3B82F6?text=X'">
    <h1 class="splash-title">Xpressa+</h1>

    <script>
        // --- EL PORTERO ENRUTADOR ---
        document.addEventListener("DOMContentLoaded", function() {
            
            // Dejamos la animación corriendo 1.5 segundos para que se vea profesional
            setTimeout(() => {
                const usuarioGuardado = localStorage.getItem('usuario_id');
                
                if (usuarioGuardado) {
                    // Si ya inició sesión antes, entra directo al juego/panel
                    window.location.href = 'home.html'; 
                } else {
                    // Si es nuevo o cerró sesión, lo mandamos a loguearse
                    window.location.href = 'sesion.html';
                }
            }, 1500); 
            
        });
    </script>
</body>
</html>
