<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xpressa+ | Cargando...</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background: linear-gradient(135deg, #a3ceef 0%, #e0f2fe 100%);
            height: 100vh; 
            display: flex; 
            flex-direction: column;
            align-items: center; 
            justify-content: center; 
            overflow: hidden;
        }

        .splash-logo { 
            width: 120px; 
            height: 120px; 
            border-radius: 30px; 
            background: white;
            box-shadow: 0 10px 25px rgba(59, 130, 246, 0.3); 
            margin-bottom: 25px; 
            padding: 2px;
            animation: latido 1.5s infinite ease-in-out;
        }

        .splash-title { 
            color: #3B82F6; 
            font-family: 'Fredoka', sans-serif; 
            font-size: 3.5rem; 
            font-weight: 700; 
            text-shadow: 3px 3px 0px #FFF; 
        }
        
        @keyframes latido {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        /* --- MEDIA QUERIES --- */
        @media (max-width: 768px) {
            .splash-logo { width: 100px; height: 100px; border-radius: 25px; }
            .splash-title { font-size: 3rem; }
        }
        @media (max-width: 480px) {
            .splash-logo { width: 90px; height: 90px; border-radius: 20px; margin-bottom: 20px; }
            .splash-title { font-size: 2.5rem; text-shadow: 2px 2px 0px #FFF; }
        }
    </style>
</head>
<body>
    <img src="imagenes/logo.png" alt="Xpressa+" class="splash-logo" onerror="this.src='https://via.placeholder.com/120/FFF/3B82F6?text=X'">
    <h1 class="splash-title">Xpressa+</h1>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            setTimeout(() => {
                const usuarioGuardado = localStorage.getItem('usuario_id');
                if (usuarioGuardado) {
                    window.location.href = 'home.html';         
                } else {
                    window.location.href = 'sesion.html';
                }
            }, 1500); 
        });
    </script>
</body>
</html>
